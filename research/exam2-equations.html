<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam 2 Equations</title>
<style>
/* ===== Equation Flashcards v2: all styles scoped under .eqf ===== */
.eqf{
  /* site colors: keep your current values for these 8 */
  --eqf-bg:#F4F5F7;--eqf-card:#FFFFFF;--eqf-ink:#15181C;--eqf-muted:#59616B;--eqf-line:#D8DCE1;--eqf-accent:#6D4AD9;--eqf-soft:#EFEAFD;--eqf-code:#F1F3F5;
  /* category colors (one per group) */
  --eqf-c1:#6D4AD9;--eqf-c1s:#EFEAFD; /* Lab 1 */
  --eqf-c2:#D9822B;--eqf-c2s:#FCEFE0; /* Light */
  --eqf-c3:#1F8A70;--eqf-c3s:#E1F4EE; /* Camera */
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--eqf-ink);background:var(--eqf-bg);padding:28px 16px 48px;line-height:1.5}
.eqf *{box-sizing:border-box}
.eqf-wrap{max-width:1040px;margin:0 auto}
.eqf-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eqf h2.eqf-title{font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.eqf .eqf-intro{color:var(--eqf-muted);margin:0;max-width:52ch}
.eqf-legend{display:flex;gap:8px;flex-wrap:wrap}
.eqf-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--cs);color:var(--c)}
.eqf-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.eqf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.eqf-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.eqf-grid{grid-template-columns:1fr}}
.eqf-card{position:relative;overflow:hidden;font:inherit;color:inherit;text-align:left;background:var(--eqf-card);border:1px solid var(--eqf-line);border-radius:16px;padding:18px 18px 16px;min-height:190px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.eqf-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.eqf-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.10);border-color:var(--c)}
.eqf-card:focus-visible,.eqf-x:focus-visible,.eqf-nav button:focus-visible,.eqf-reveal:focus-visible{outline:3px solid var(--eqf-accent);outline-offset:3px}
.eqf-row{display:flex;justify-content:space-between;align-items:center}
.eqf-num{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--eqf-muted);font-variant-numeric:tabular-nums}
.eqf-ico{width:52px;height:52px;border-radius:14px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.eqf-ico svg{width:30px;height:30px}
.eqf-name{font-size:20px;font-weight:750;line-height:1.2;margin-top:auto}
.eqf-hint{font-size:13px;color:var(--eqf-muted);display:flex;align-items:center;gap:6px}
.eqf-hint span{transition:transform .18s}
.eqf-card:hover .eqf-hint span{transform:translateX(4px)}
.eqf-seen{position:absolute;right:14px;bottom:14px;font-size:11px;font-weight:700;color:var(--c);opacity:0}
.eqf-card.is-seen .eqf-seen{opacity:1}
/* modal */
.eqf-overlay{position:fixed;inset:0;background:rgba(10,12,15,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999;opacity:0;transition:opacity .2s}
.eqf-overlay[hidden]{display:none}
.eqf-overlay.eqf-open{opacity:1}
.eqf-modal{background:var(--eqf-card);color:var(--eqf-ink);width:100%;max-width:740px;max-height:90vh;display:flex;flex-direction:column;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.32);transform:translateY(10px) scale(.97);transition:transform .22s;overflow:hidden}
.eqf-open .eqf-modal{transform:none}
@media(max-width:480px){.eqf-overlay{padding:0}.eqf-modal{max-height:100vh;height:100%;border-radius:0}}
.eqf-head{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--cs);border-bottom:1px solid var(--eqf-line)}
.eqf-head .eqf-ico{background:var(--eqf-card)}
.eqf-head-t{flex:1;min-width:0}
.eqf-head h3{margin:2px 0 0;font-size:24px;line-height:1.15}
.eqf-x{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--eqf-line);background:var(--eqf-card);color:var(--eqf-ink);font-size:26px;line-height:1;cursor:pointer;transition:transform .15s}
.eqf-x:hover{transform:rotate(90deg)}
.eqf-body{padding:20px 18px;display:grid;gap:18px;overflow:auto}
.eqf-formula{position:relative;border:2px solid var(--c);border-radius:14px;padding:22px 16px 18px;font-size:23px;font-weight:750;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--eqf-card)}
.eqf-formula::before{content:"FORMULA";position:absolute;top:-10px;left:14px;background:var(--c);color:#fff;font:700 11px/1 system-ui,sans-serif;letter-spacing:.12em;padding:5px 8px;border-radius:6px}
.eqf-viz{background:var(--eqf-bg);border:1px solid var(--eqf-line);border-radius:14px;padding:12px 10px 8px}
.eqf-viz svg{display:block;width:100%;height:auto}
.eqf-viz text{fill:var(--eqf-ink);font-family:inherit;font-size:15px}
.eqf-viz .m{fill:var(--eqf-muted);font-size:13px}
.eqf-viz .b{font-weight:800}
.eqf-viz .cc{fill:var(--c)}
.eqf-viz .ln{stroke:var(--eqf-muted);stroke-width:1.5;fill:none}
.eqf-viz .lt{fill:#F6C453}
.eqf-vcap{font-size:13px;color:var(--eqf-muted);text-align:center;margin:6px 0 2px}
.eqf-sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--eqf-muted)}
.eqf-sec p{margin:0}
.eqf-parts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.eqf-parts li{display:flex;gap:10px;align-items:flex-start;background:var(--eqf-bg);border-radius:10px;padding:10px 12px}
.eqf-parts li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--c)}
.eqf-steps{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:s}
.eqf-steps li{counter-increment:s;display:flex;gap:10px;align-items:baseline;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--eqf-code);border-radius:10px;padding:9px 12px}
.eqf-steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center}
.eqf-steps li.last{background:var(--cs);font-weight:700}
.eqf-note{font-size:14px;color:var(--eqf-muted);margin-top:6px}
.eqf-trick{display:flex;gap:12px;align-items:flex-start;background:var(--cs);border-radius:12px;padding:12px 14px}
.eqf-trick b{color:var(--c)}
.eqf-bulb{flex:none;width:28px;height:28px;color:var(--c)}
.eqf-check{border:1px dashed var(--c);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.eqf-reveal{justify-self:start;font:inherit;font-weight:700;border:none;background:var(--c);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
.eqf-ans{font-weight:700;color:var(--c)}
.eqf table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.eqf td,.eqf th{border-bottom:1px solid var(--eqf-line);padding:7px 8px;text-align:center}
.eqf th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--eqf-muted)}
.eqf-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--eqf-line);background:var(--eqf-card)}
.eqf-nav button{font:inherit;font-weight:700;border:1px solid var(--eqf-line);background:var(--eqf-card);color:var(--eqf-ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.eqf-nav button:hover{border-color:var(--eqf-accent)}
.eqf-dots{display:flex;gap:6px}
.eqf-dots i{width:8px;height:8px;border-radius:50%;background:var(--eqf-line)}
.eqf-dots i.on{background:var(--eqf-accent);transform:scale(1.25)}
@media(max-width:480px){.eqf-dots{display:none}}
@media(prefers-reduced-motion:reduce){.eqf-card,.eqf-overlay,.eqf-modal,.eqf-x,.eqf-hint span{transition:none}}
.eqf-grid{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.eqf-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.eqf-grid{grid-template-columns:1fr}}
.eqf-card{min-height:170px}
.eqf-card.is-open{border-color:var(--c);box-shadow:0 0 0 3px var(--cs)}
.eqf-panel{margin-top:18px;background:var(--eqf-card);border:1px solid var(--eqf-line);border-radius:20px;overflow:hidden}
.eqf-panel[hidden]{display:none}
.eqf-panel .eqf-body{overflow:visible}
.eqf-nav .eqf-count{font-size:13px;color:var(--eqf-muted);font-weight:700}
.eqf-viz svg{max-width:560px;margin:0 auto}
@media(max-width:480px){.eqf-formula{font-size:17px;padding:20px 12px 14px}}
.eqf-soon{border:2px dashed var(--eqf-line);border-radius:16px;min-height:170px;display:grid;place-items:center;text-align:center;color:var(--eqf-muted);padding:18px;font-size:14px}
</style></head><body style="margin:0">

<script>
(function(){
/* To add a lab: add a group below, then push cards with g:"<group>" and a matching VIZ entry. */
var GROUPS={l1:{name:"Lab 1 · Noise",c:"--eqf-c1",cs:"--eqf-c1s"},lec:{name:"Lectures",c:"--eqf-c2",cs:"--eqf-c2s"},l3:{name:"Lab 3",c:"--eqf-c3",cs:"--eqf-c3s"}};
var S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
var ICONS={
 snr:'<svg viewBox="0 0 32 32" '+S+'><path d="M3 24 C8 24 10 6 16 6 S24 24 29 24"/><path d="M16 6v20" stroke-dasharray="2 2"/><path d="M11 18h10"/></svg>',
 stops:'<svg viewBox="0 0 32 32" '+S+'><path d="M4 26h6v-6h6v-6h6V8h6"/><path d="M24 4l4 4-4 4" /></svg>',
 bits:'<svg viewBox="0 0 32 32" '+S+'><rect x="4" y="20" width="5" height="8"/><rect x="11" y="15" width="5" height="13"/><rect x="18" y="9" width="5" height="19"/><rect x="25" y="4" width="4" height="24"/></svg>',
 lens:'<svg viewBox="0 0 32 32" '+S+'><path d="M16 4 Q22 16 16 28 Q10 16 16 4Z"/><path d="M2 10 L16 10 L30 22"/><path d="M2 16 H30" stroke-dasharray="2 2"/></svg>',
 scale:'<svg viewBox="0 0 32 32" '+S+'><rect x="3" y="18" width="7" height="10"/><rect x="14" y="4" width="15" height="24"/><path d="M10 23 L14 16"/></svg>',
 aov:'<svg viewBox="0 0 32 32" '+S+'><path d="M4 16 L28 4 M4 16 L28 28"/><path d="M12 12 Q15 16 12 20"/><rect x="2" y="13" width="4" height="6"/></svg>',
 crop:'<svg viewBox="0 0 32 32" '+S+'><rect x="3" y="6" width="26" height="20" rx="2"/><rect x="9" y="10.5" width="14" height="11" rx="1.5" fill="currentColor" fill-opacity=".3"/></svg>'
};
var BULB='<svg class="eqf-bulb" viewBox="0 0 24 24" '+S+'><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
var CARDS=[
{g:"l1",ic:"snr",name:"SNR (Signal-to-Noise Ratio)",formula:"SNR = 20 × log₁₀(Mean ÷ Std Dev)",
 what:"How clean a patch is, in decibels (dB). The mean is the signal (the real brightness). The standard deviation is the noise (how much the pixels jump around). HIGHER SNR = CLEANER image.",
 parts:["<b>Mean</b> = average pixel value of the 100 × 100 px patch (the signal)","<b>Std Dev</b> = standard deviation, how spread out the pixels are (the noise)","Both numbers come from Photoshop: Window › Histogram › Expanded View","<b>dB</b> = decibels, the unit of the answer"],
 table:[["Mean ÷ Std Dev","SNR"],["1","0 dB"],["2","≈ 6 dB"],["10","20 dB"],["100","40 dB"]],
 steps:["SNR = 20 × log(118 ÷ 2.5)","= 20 × log(47.2)","= 20 × 1.674","= 33.5 dB"],given:"Gray patch: mean 118, std dev 2.5",
 note:"Divide FIRST, then log, then × 20. The black patch usually gives a lower SNR because its mean (signal) is small.",
 trick:"<b>Signal on top, noise on the bottom.</b> Every ×10 in the ratio adds +20 dB. Higher ISO → bigger std dev → LOWER SNR.",
 q:"Mean 200, std dev 2. What's the SNR?",a:"200 ÷ 2 = 100 → log(100) = 2 → 20 × 2 = 40 dB"},
{g:"l1",ic:"stops",name:"Stops & Equivalent Exposure",formula:"+1 stop = ISO × 2\n= shutter time × 2\n= f-number ÷ 1.4",
 what:"A stop doubles (or halves) the light. An equivalent exposure keeps the brightness the same: if one setting gives +1 stop, another setting must give −1 stop. Bracketing (N ± stops) changes only ONE setting on purpose.",
 parts:["<b>ISO</b>: 100 → 200 is +1 stop (brighter)","<b>Shutter</b>: 1/250 → 1/125 is +1 stop (more time = more light)","<b>Aperture</b>: f/8 → f/5.6 is +1 stop (smaller number = bigger hole)","<b>N</b> = the base exposure. N+2 = 2 stops brighter, N−3 = 3 stops darker"],
 table:[["f-number","Shutter","ISO"],["f/2.8","1/30","6400"],["f/4","1/60","3200"],["f/5.6","1/125","1600"],["f/8","1/250","800"],["f/11","1/500","400"],["f/16","1/1000","200"],["f/22","1/2000","100"]],tcap:"Each row down = 1 stop LESS light (read each column on its own).",
 steps:["Base N: 1/125, f/11, ISO 200","ISO 200 → 800 = +2 stops brighter","Keep it equivalent: shutter −2 stops","1/125 → 1/250 → 1/500"],given:"Raise ISO 2 stops but keep the same brightness",
 note:"Bracketing example: base f/11, N−2 using the aperture only → f/16 → f/22.",
 trick:"<b>See-saw rule:</b> one side up, the other side down by the same number of stops. Count stops by counting jumps on the ladder.",
 q:"Base 1/250, f/4, ISO 400. N+2 using the shutter only?",a:"1/250 → 1/125 → 1/60 (2 jumps slower)"},
{g:"l1",ic:"crop",name:"Crop Factor & Pixel Size",formula:"crop factor = 43.3 mm ÷ sensor diagonal\npixel size = sensor width ÷ pixels across",
 what:"Crop factor compares your sensor to full frame (36 × 24 mm, diagonal 43.3 mm). Pixel size (pixel pitch) is how wide each pixel is, in µm. Bigger pixels catch more light → more signal → higher SNR → less noise.",
 parts:["<b>Diagonal</b> = √(width² + height²)","<b>µm</b> = micrometer = 0.001 mm","Full frame = 1.0 · Nikon/Sony APS-C ≈ 1.5 · Canon APS-C ≈ 1.6 · Micro Four Thirds = 2.0"],
 table:[["Sensor (24 MP)","Width","Pixel size"],["Full frame","36 mm","6.0 µm"],["APS-C","23.5 mm","3.9 µm"]],
 steps:["Diagonal = √(23.5² + 15.6²) = 28.2 mm","Crop = 43.3 ÷ 28.2 ≈ 1.5","Pixel = 23.5 mm ÷ 6000 px = 0.0039 mm","= 3.9 µm"],given:"APS-C sensor 23.5 × 15.6 mm, 6000 px across",
 note:"Same megapixels on a bigger sensor = bigger pixels. That's why full frame usually has less noise at the same ISO.",
 trick:"<b>Big bucket, more rain.</b> A bigger pixel is a bigger bucket: it catches more light (signal) for the same noise.",
 q:"A sensor is 36 mm wide with 7200 px across. What's the pixel size?",a:"36 ÷ 7200 = 0.005 mm = 5.0 µm"},
{g:"lec",ic:"bits",name:"Bit Depth: Gray Levels",formula:"levels = 2^bits\nvalues = 0 … (2^bits − 1)",
 what:"Bit depth is how many gray levels each channel can record. Each extra bit DOUBLES the levels. It's not the same thing as dynamic range (the useful range from darkest to brightest detail).",
 parts:["<b>8-bit</b> (JPEG) = 256 levels, values <b>0–255</b>","<b>12-bit</b> (typical raw) = 4,096 levels","<b>16-bit</b> = 65,536 levels","Printing is done at 8 bits, so edit at more bits to avoid banding"],
 table:[["Bits","Levels","Values"],["1","2","0–1"],["8","256","0–255"],["12","4,096","0–4,095"],["14","16,384","0–16,383"],["16","65,536","0–65,535"]],
 steps:["levels = 2^bits","= 2^10","= 1,024 levels","values 0 – 1,023"],given:"A 10-bit image",
 note:"8 bits = 1 byte. Kilobyte: 1,000 bytes (decimal) or 1,024 bytes (binary).",
 trick:"<b>Each bit doubles.</b> 8 bits → 256, so 0–255 (not 1–256!). A favorite test question.",
 q:"How many levels does a 14-bit raw have?",a:"2^14 = 16,384 levels (0–16,383)"},
{g:"lec",ic:"lens",name:"Lens Equation",formula:"1/f = 1/u + 1/v",
 what:"Connects the focal length (f) with the object distance (u) and the image distance (v). Measure u and v, add the reciprocals, and FLIP the result to get f.",
 parts:["<b>u</b> = object distance (subject → lens). Trick: close the <b>U</b> into an <b>O</b> = Object","<b>v</b> = image distance (lens → sharp image)","<b>f</b> = focal length (object at infinity → v = f)"],
 steps:["1/f = 1/300 + 1/150","= 0.00333 + 0.00667","= 0.01  ← this is 1/f, not f!","press 1/x → f = 100 mm"],given:"u = 300 mm, v = 150 mm",
 note:"About 60% of students stop at 0.01. A focal length of 0.01 mm makes no sense, so always invert.",
 trick:"<b>Add the flips, then flip the answer.</b> Check that it makes sense.",
 q:"u = 200 mm, v = 200 mm. What is f?",a:"1/200 + 1/200 = 0.01 → f = 100 mm (that's 1:1, u = v = 2f)"},
{g:"lec",ic:"scale",name:"Scale of Reproduction",formula:"R = v / u = (v − f) / f\nv = f (R + 1)\nR = f / (u − f)",
 what:"R (or M, magnification) = how big the image is compared to the real object. R = 3 (3:1) = 3× life size. R = 1 (1:1) = life size. You can also use image size ÷ object size.",
 parts:["Know <b>f and R</b>? Find v with <b>v = f(R + 1)</b>, then u = v ÷ R","Know <b>u and v</b>? R = v ÷ u","Know <b>v and f</b>? R = (v − f) ÷ f","Know <b>u and f</b>? R = f ÷ (u − f)"],
 steps:["v = f (R + 1) = 100 × (3 + 1)","v = 400 mm","R = v / u → 3 = 400 / u","u = 400 / 3 ≈ 133.3 mm"],given:"f = 100 mm, R = 3 (3:1)",
 note:"1:1 → v = u = 2f. In lab you'll set a 4×5 camera to a given R.",
 trick:"<b>R = v/u</b>: Image over Object. When R goes up, v gets longer (bellows out).",
 q:"f = 150 mm, R = 1. What are v and u?",a:"v = 150 × 2 = 300 mm, u = 300 mm"},
{g:"lec",ic:"aov",name:"Angle of View",formula:"AOV = 2 × arctan(d ÷ 2f)",
 what:"How much of the scene the lens sees, usually measured on the sensor DIAGONAL (d). Longer focal length = narrower view and bigger subject. Perspective is controlled by camera distance, NOT focal length.",
 parts:["<b>d</b> = sensor diagonal (43.3 mm full frame)","<b>f</b> = focal length","A crop sensor narrows the view (APS-C ≈ ×1.5)"],
 table:[["Full frame","Angle (diagonal)"],["20 mm","≈ 94°"],["50 mm","≈ 47°"],["300 mm","≈ 8°"]],
 steps:["AOV = 2 × arctan(43.3 ÷ (2 × 50))","= 2 × arctan(0.433)","= 2 × 23.4°","≈ 47°"],given:"50 mm lens on full frame",
 note:"Formula = beyond the lecture. On the exam, know the table and the ideas.",
 trick:"<b>Zoom in = see less.</b> Walk closer = change perspective.",
 q:"Which lens sees more of the scene: 28 mm or 200 mm?",a:"28 mm (wider angle of view)"},
{g:"lec",ic:"lens",name:"Diopters (Supplemental Lenses)",formula:"D = 1 / f   (f in meters)\nf = 1 / D\nD_combined = D + D_s",
 what:"A supplemental (close-up) lens screws onto the front of a lens. Its power is in DIOPTERS, defined with the focal length in METERS. Diopters simply add up when you stack them.",
 parts:["<b>D</b> = power in diopters","<b>f</b> = focal length in <b>meters</b> (× 1000 for mm)","Stacking +1 and +3 = <b>+4</b>"],
 table:[["Diopters","Focal length"],["+1","1 m = 1000 mm"],["+2","½ m = 500 mm"],["+4","¼ m = 250 mm"]],
 steps:["D = 1 + 3 = 4 diopters","f = 1 / 4 m","= 0.25 m","= 250 mm"],given:"Stack a +1 and a +3",
 note:"The 49 mm printed on the ring is the thread diameter, not the focal length.",
 trick:"<b>Flip it and think in meters.</b> 2 diopters → ½ m → 500 mm.",
 q:"What is the focal length of a +5 diopter lens?",a:"1/5 m = 0.2 m = 200 mm"},
{g:"lec",ic:"lens",name:"Optimum Pinhole Diameter",formula:"D = √f ÷ 141   (inches)\nD = √f ÷ 28   (millimeters)",
 what:"There is one best size for a pinhole. Too big lets in more light but blurs the image; too small blurs it with diffraction. The best diameter depends on the pinhole-to-film (or sensor) distance.",
