button{font:inherit}

.jb[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.jb:disabled{cursor:default;opacity:.5}

.back{justify-self:center;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer}

.lb{position:fixed;inset:0;z-index:9999;background:rgba(8,6,14,.97);display:grid;grid-template-rows:auto 1fr auto;opacity:0;transition:opacity .2s;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.lb[hidden]{display:none}
.lb.on{opacity:1}

.lb-count{font-size:13px;font-weight:700;letter-spacing:.08em;color:#CFC6EE}
.lb-x,.lb-nav{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center}

.lb-prev{left:10px}.lb-next{right:10px}

.lb-cap b{display:block;font-size:16px}

@media(prefers-reduced-motion:reduce){.jb,.ph img,.lb{transition:none}}

<div class="eyebrow">Photographic Research</div>
<h1>Photo Journals</h1>
<p>Each week I research two photographers, choose six photographs by each, and write about why they caught my attention. Pick a journal to read it.</p>
</header>

var flat=[];/* photos in the open journal, for the lightbox */
function render(i,scroll){var j=JOURNALS[i];flat=[];
 btns.forEach(function(b,k){b.setAttribute('aria-pressed',k===i?'true':'false');var t=b.querySelector('.tag');if(t)t.remove();if(k===i){var s=document.createElement('span');s.className='tag';s.textContent='Open';b.appendChild(s);}});
 var h='<article class="w" style="gap:36px">';
 h+='<section class="hero"><div class="strip"></div>'+img(j,j.heroImg,'',null,false)+'<div class="in"><div class="eyebrow">Journal '+j.n+' · '+esc(j.week)+(j.date?' · '+esc(j.date):'')+'</div><h2>'+esc(j.title)+'</h2><div class="sub">'+esc(j.subtitle)+'</div><nav class="toc" aria-label="Photographers in this journal">'+j.chapters.map(function(c,ci){return '<a href="#j'+j.n+'-ch'+(ci+1)+'">0'+(ci+1)+' · '+esc(c.name)+'</a>';}).join('')+'</nav></div></section>';
 j.chapters.forEach(function(c,ci){
  var id='j'+j.n+'-ch'+(ci+1);
  h+='<section class="chapter" id="'+id+'" aria-labelledby="'+id+'-t">';
  h+='<div class="ch-head"><div class="num" aria-hidden="true">0'+(ci+1)+'</div><div><h3 id="'+id+'-t">'+esc(c.name)+'</h3><div class="role">'+esc(c.tagline)+'</div></div></div>';
  h+='<div class="ch-top'+(c.feature?'':' solo')+'">';
  if(c.feature){var fi=flat.length;flat.push({j:j,name:c.feature.img,cap:c.feature.caption,title:''});
   h+='<figure class="feature"><button type="button" data-i="'+fi+'" aria-label="View larger: '+esc(c.feature.caption)+'">'+img(j,c.feature.img,c.feature.caption,null,true)+'</button><figcaption>'+esc(c.feature.caption)+'</figcaption></figure>';}
  h+='<div class="source"><div class="who-row">'+(c.portrait?img(j,c.portrait,'Portrait of '+c.name,'avatar',true):'')+'<div><span class="chip">'+esc(c.source.type)+'</span><div style="font-weight:800;margin-top:4px">'+esc(c.name)+'</div></div></div><dl>';
  c.source.rows.forEach(function(r){h+='<dt>'+esc(r[0])+'</dt><dd>'+(r[2]?'<a href="'+esc(r[2])+'" target="_blank" rel="noopener">'+esc(r[1])+' ↗</a>':esc(r[1]))+'</dd>';});
  h+='</dl></div></div>';
  h+='<div class="gallery-t"><h4>Six photographs I chose</h4><span class="muted" style="font-size:13px">Tap a photo to enlarge</span></div><ul class="gallery">';
  c.photos.forEach(function(p,pi){var fi=flat.length;flat.push({j:j,name:p.img,cap:p.caption,title:c.name+' · '+(pi+1)+' of 6'});
   h+='<li class="ph"><figure style="margin:0"><button type="button" data-i="'+fi+'" aria-label="View larger: photo '+(pi+1)+(p.caption?', '+esc(p.caption):'')+'">'+img(j,p.img,c.name+', photo '+(pi+1)+(p.caption?': '+p.caption:''),null,true)+'<span class="k">'+(pi+1)+'</span></button>'+(p.caption?'<figcaption><b>'+(pi+1)+'.</b> '+esc(p.caption)+'</figcaption>':'')+'</figure></li>';});
  h+='</ul>';
  var parts=c.reflection.match(/^(.+?[.!?])\s+([\s\S]*)$/)||[null,c.reflection,''];
  h+='<div class="reflect"><h4>Why I chose '+esc(c.name)+'</h4><p class="lead">'+esc(parts[1])+'</p>'+(parts[2]?'<p class="rest">'+esc(parts[2])+'</p>':'')+'</div>';
  h+='</section>';
  if(ci<j.chapters.length-1)h+='<div class="divider" aria-hidden="true"></div>';
 });
 if(j.notes&&j.notes.length){h+='<section class="foot"><h4>Research notes & sources</h4><ul>'+j.notes.map(function(n){return '<li>'+(n[1]?'<a href="'+esc(n[1])+'" target="_blank" rel="noopener">'+esc(n[0])+' ↗</a>':esc(n[0]))+'</li>';}).join('')+'</ul></section>';}
 h+='<button class="back" type="button" id="backTop">↑ Back to journals</button></article>';
 view.innerHTML=h;
 view.querySelectorAll('[data-i]').forEach(function(b){b.addEventListener('click',function(){openLB(+b.getAttribute('data-i'),b);});});
 view.querySelectorAll('.toc a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});});});
 document.getElementById('backTop').addEventListener('click',function(){picker.scrollIntoView({behavior:'smooth',block:'start'});btns[i].focus({preventScroll:true});});
 if(scroll)view.scrollIntoView({behavior:'smooth',block:'start'});
}

/* lightbox */
var lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap'),lbCount=document.getElementById('lbCount'),lbX=document.getElementById('lbX'),cur=0,opener=null,prevOv='';
function showLB(k){cur=(k+flat.length)%flat.length;var p=flat[cur];lbImg.src='journals/'+p.j.dir+'/'+p.name+'.jpg';lbImg.alt=p.cap||p.title;
 lbCount.textContent=(p.title||'Photo')+'';lbCap.innerHTML=p.cap?'<b>'+esc(p.cap)+'</b>':'';}
function openLB(k,btn){opener=btn;showLB(k);lb.hidden=false;prevOv=document.body.style.overflow;document.body.style.overflow='hidden';requestAnimationFrame(function(){lb.classList.add('on');});lbX.focus();}
function closeLB(){if(lb.hidden)return;lb.classList.remove('on');document.body.style.overflow=prevOv;setTimeout(function(){lb.hidden=true;lbImg.removeAttribute('src');},180);if(opener)opener.focus();}
lbX.addEventListener('click',closeLB);
document.getElementById('lbPrev').addEventListener('click',function(){showLB(cur-1);});
document.getElementById('lbNext').addEventListener('click',function(){showLB(cur+1);});
lb.addEventListener('click',function(e){if(e.target===lb||e.target.id==='lbStage')closeLB();});
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight')showLB(cur+1);else if(e.key==='ArrowLeft')showLB(cur-1);
 else if(e.key==='Tab'){var f=lb.querySelectorAll('button'),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
var sx=null;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)showLB(cur+(dx<0?1:-1));sx=null;});

render(0,false);
})();
</script>
</body></html>
