function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
if(!S.mode)S.mode=S.typeMode?"type":"auto";
if(!S.star)S.star={};
S.L=Object.assign({size:7,types:{mc:true,written:true,tf:true,flash:false},dir:"normal",shuffle:true,smart:false,retype:false,starred:false},S.L||{});
if(S.setSize&&!S.L._m){S.L.size=S.setSize;S.L._m=1;}
let run=null; let confirmReset=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).toLowerCase().replace(/[–—]/g,"-").replace(/½/g,"1/2").replace(/¼/g,"1/4").replace(/⅛/g,"1/8").replace(/\s+/g," ").replace(/[.!]+$/,"").trim();}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
function seqTokens(s){return norm(s).replace(/f\s*\//g," ").replace(/\bsec(onds?)?\b/g," ").replace(/→|->|>/g," ").split(/[\s,;]+/).filter(t=>t&&t!=="-");}
function answerText(q){
  if(q.k==="gen")return q.d;
  if(q.k==="mc"||q.k==="spd")return q.o[0];
  if(q.k==="tf")return q.a?"True":"False";
  if(q.k==="fill")return q.a[0].replace(/\b\w/g,c=>c.toUpperCase());
  if(q.k==="num")return q.d;
  if(q.k==="seq")return q.a.join(", ");
  if(q.k==="multi")return q.c.map(i=>q.o[i]).join(", ");
}

/* ---------- generated questions: fresh numbers every time ---------- */
let RNG=Math.random;
function seeded(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pk=a=>a[Math.floor(RNG()*a.length)];
function rshuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const art=n=>/^(8|11|18)/.test(String(n))?"an":"a",ratio=m=>m>=1?m+":1":"1:"+Math.round(1/m*100)/100;
const r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100,r3=x=>Math.round(x*1000)/1000;
const SH=["1/4","1/8","1/15","1/30","1/60","1/125","1/250","1/500","1/1000","1/2000","1/4000"];
const AP=["1.4","2","2.8","4","5.6","8","11","16","22","32"];
const IS=[100,200,400,800,1600,3200,6400];
function mcFrom(right,pool){const others=rshuffle(pool.filter(x=>x!==right)).slice(0,3);return [right].concat(others);}
const GEN={
 snr(){const sd=pk([2,2.5,4,5,8,10]),ratio=pk([2,3,4,5,8,10,12,20,25,50]),mean=r1(sd*ratio),a=r2(20*Math.log10(mean/sd));
  return{k:"num",q:`A gray patch measures mean ${mean} and standard deviation ${sd}. What is its SNR in dB? (1 decimal)`,a,tol:0.15,d:`${r1(a)} dB`,e:`SNR = 20 × log(${mean} ÷ ${sd}) = 20 × log(${r2(mean/sd)}) ≈ ${r1(a)} dB.`};},
 tones(){const b=pk([1,2,3,4,5,6,7,8,10,12,14,16]),a=2**b;
  return{k:"num",q:`How many tones can a ${b}-bit image (or channel) hold?`,a,tol:0,d:a.toLocaleString("en-US"),e:`2^${b} = ${a.toLocaleString("en-US")} tones${b===8?" (values 0–255)":""}.`};},
 bits(){const b=pk([1,2,3,4,5,6,7,8,10,12]),t=2**b;
  return{k:"num",q:`An image has ${t.toLocaleString("en-US")} possible tones. How many bits is that?`,a:b,tol:0,d:`${b} bits`,e:`2^x = ${t} → x = ${b}.`};},
 crop(){const s=pk([[23.5,15.6],[22.3,14.9],[17.3,13],[13.2,8.8],[27.9,18.6],[25.1,16.7],[6.17,4.55]]),dg=r1(Math.hypot(s[0],s[1])),a=r2(43.3/dg);
  return{k:"num",q:`A sensor measures ${s[0]} × ${s[1]} mm, so its diagonal is about ${dg} mm. What is its crop factor? (2 decimals)`,a,tol:0.02,d:`${a}`,e:`Crop factor = 43.3 ÷ ${dg} ≈ ${a}.`};},
 equiv(){const f=pk([16,18,24,28,35,50,85,100,135,200]),c=pk([1.5,1.6,2]),a=r1(f*c);
  return{k:"num",q:`${art(f)==="an"?"An":"A"} ${f} mm lens is used on a ${c}× crop camera. What full-frame focal length does it act like (mm)?`,a,tol:0.6,d:`${a} mm`,e:`${f} × ${c} = ${a} mm.`};},
 lens(){const f=pk([25,40,50,60,75,80,100,120,150,200]),m=pk([0.25,0.5,1,2,3,4]),v=f*(m+1),u=r1(v/m);
  return{k:"num",q:`Object distance u = ${u} mm and image distance v = ${v} mm. What is the focal length (mm)?`,a:f,tol:0.6,d:`${f} mm`,e:`1/${u} + 1/${v} = ${(1/u+1/v).toFixed(5)} → press 1/x → ${f} mm.`};},
 comb(){const p=pk([[30,60],[40,40],[50,100],[60,120],[85,200],[100,150],[150,300],[200,200],[75,150],[120,180]]),a=r1(1/(1/p[0]+1/p[1]));
  return{k:"num",q:`Two lenses of ${p[0]} mm and ${p[1]} mm are put together (touching). What is the combined focal length (mm)?`,a,tol:0.6,d:`${a} mm`,e:`1/${p[0]} + 1/${p[1]} = ${(1/p[0]+1/p[1]).toFixed(5)} → 1/x → ${a} mm.`};},
 diop(){if(RNG()<.5){const f=pk([40,50,100,125,200,250,500,1000,2000]),a=r2(1000/f);
   return{k:"num",q:`A lens has a focal length of ${f} mm. What is its power in diopters?`,a,tol:0.05,d:`${a} D`,e:`Convert to METERS first: ${f} mm = ${f/1000} m. D = 1 ÷ ${f/1000} = ${a}.`};}
  const d1=pk([1,2,3,4]),d2=pk([1,2,3,4,10]),a=r1(1000/(d1+d2));
  return{k:"num",q:`You stack a +${d1} and a +${d2} diopter lens. What is the combined focal length (mm)?`,a,tol:1,d:`${a} mm`,e:`Diopters add: ${d1} + ${d2} = ${d1+d2} D. f = 1 ÷ ${d1+d2} m ≈ ${a} mm.`};},
 scale(){const f=pk([35,50,60,85,100,105,150]),m=pk([0.5,1,2,3,4]),v=f*(m+1),u=r2(v/m);
  if(RNG()<.5)return{k:"num",q:`For a ${ratio(m)} reproduction (m = ${m}) with ${art(f)} ${f} mm lens, what is the image distance v (mm)?`,a:v,tol:0.6,d:`${v} mm`,e:`v = f(m + 1) = ${f} × ${m+1} = ${v} mm.`};
  return{k:"num",q:`For a ${ratio(m)} reproduction (m = ${m}) with ${art(f)} ${f} mm lens, what is the object distance u (mm)? (1 decimal)`,a:u,tol:0.15,d:`${r1(u)} mm`,e:`v = f(m + 1) = ${v} mm, then u = v ÷ m = ${v} ÷ ${m} ≈ ${r1(u)} mm.`};},
 ruler(){const w=pk([24,36,48,60,72,96,120,240]),a=r2(24/w);
  return{k:"num",q:`You photograph a ruler with a full-frame camera, and ${w} mm of the ruler fills the frame's 24 mm short side. What is the scale of reproduction R? (2 decimals)`,a,tol:0.006,d:`${a}`,e:`R = 24 ÷ ${w} = ${a}.`};},
 fnum(){const f=pk([24,35,50,85,100,135,200,300,400]),n=pk([1.4,2,2.8,4,5.6,8,11,16]),a=r1(f/n);
  return{k:"num",q:`How wide is the aperture of ${art(f)} ${f} mm lens set to f/${n}? (mm, 1 decimal)`,a,tol:0.15,d:`${a} mm`,e:`Diameter = focal length ÷ f-number = ${f} ÷ ${n} ≈ ${a} mm.`};},
 pin(){if(RNG()<.5){const f=pk([4,6,8,9,12,16,25]),a=r3(Math.sqrt(f)/141);
   return{k:"num",q:`What is the best pinhole diameter (inches) for a pinhole ${f} inches from the film? (3 decimals)`,a,tol:0.0015,d:`${a} in`,e:`D = √f ÷ 141 = ${r3(Math.sqrt(f))} ÷ 141 ≈ ${a} in.`};}
  const f=pk([100,144,150,196,225,400]),a=r2(Math.sqrt(f)/28);
  return{k:"num",q:`What is the best pinhole diameter (mm) for a pinhole ${f} mm from the sensor? (2 decimals)`,a,tol:0.01,d:`${a} mm`,e:`D = √f ÷ 28 = ${r2(Math.sqrt(f))} ÷ 28 ≈ ${a} mm.`};},
 hyper(){const h=pk([10,12,16,20,24,30,36,40,50,60]);
  return{k:"num",q:`The hyperfocal distance is ${h} ft and you focus at ${h} ft. Everything is sharp from how many feet to infinity?`,a:h/2,tol:0,d:`${h/2} ft`,e:`Half the hyperfocal distance: ${h} ÷ 2 = ${h/2} ft.`};},
 hand(){const f=pk([24,28,35,50,70,85,100,135,200,300]),c=pk([1,1.5,1.6]),x=f*c,dens=[15,30,60,125,250,500,1000];let i=dens.findIndex(d=>d>=x);if(i<0)i=dens.length-1;
  const right="1/"+dens[i],o=mcFrom(right,dens.map(d=>"1/"+d).filter((_,j)=>Math.abs(j-i)<=3));
  return{k:"mc",q:`Handheld rule: ${art(f)} ${f} mm lens on a ${c===1?"full-frame":c+"× crop"} camera. What is the slowest whole-stop shutter speed you should handhold?`,o,e:`${f} × ${c} = ${r1(x)}, so 1/${r1(x)}, rounded to the next faster whole stop = ${right}.`};},
 isstop(){const base=pk([4,5,6,7,8]),st=pk([2,3,4]),right=SH[base-st];
  return{k:"mc",q:`The handheld rule gives ${SH[base]}. Your lens has ${st} stops of image stabilization. About how slow can you safely go?`,o:mcFrom(right,SH.slice(Math.max(0,base-st-2),base+2)),e:`Each stop of IS = one shutter stop slower: ${SH.slice(base-st,base+1).reverse().join(" → ")}.`};},
 nd(){if(RNG()<.5){const k=ri(1,10),d=r1(0.3*k);return{k:"num",q:`An ND ${d} filter blocks how many stops of light?`,a:k,tol:0,d:`${k} stops`,e:`Every 0.3 of density = 1 stop: ${d} ÷ 0.3 = ${k}.`};}
  const k=ri(1,10);return{k:"num",q:`What density of ND filter blocks ${k} stop${k>1?"s":""}? (1 decimal)`,a:r1(0.3*k),tol:0.05,d:`ND ${r1(0.3*k)}`,e:`${k} × 0.3 = ${r1(0.3*k)}.`};},
 expo(){for(let tries=0;tries<200;tries++){
   const s=ri(2,8),a=ri(1,7),i=ri(0,5),d=pk([-4,-3,-2,-1,1,2,3,4]),solve=pk(["s","a","i"]);
   const ns=s+ri(-3,3),na=a+ri(-3,3),ni=i+ri(-3,3);let S2=solve==="s"?null:ns,A2=solve==="a"?null:na,I2=solve==="i"?null:ni;
   if(S2!==null&&(S2<0||S2>=SH.length))continue;if(A2!==null&&(A2<0||A2>=AP.length))continue;if(I2!==null&&(I2<0||I2>=IS.length))continue;
   // exposure = -shutter -aperture +iso (bigger = brighter); N+d is d stops brighter
   const E0=-s-a+i,E1=E0+d;
   if(solve==="s")S2=-E1-A2+I2;else if(solve==="a")A2=-E1-S2+I2;else I2=E1+S2+A2;
   if(S2<0||S2>=SH.length||A2<0||A2>=AP.length||I2<0||I2>=IS.length)continue;
   const changed=[S2!==s,A2!==a,I2!==i].filter(Boolean).length;if(changed<2)continue;
   const fmt={s:k=>SH[k],a:k=>"f/"+AP[k],i:k=>"ISO "+IS[k]},arr={s:SH.map((_,k)=>k),a:AP.map((_,k)=>k),i:IS.map((_,k)=>k)},val={s:S2,a:A2,i:I2};
   const right=fmt[solve](val[solve]),pool=arr[solve].filter(k=>Math.abs(k-val[solve])<=3).map(fmt[solve]);
   const given=[solve!=="s"?SH[S2]:null,solve!=="a"?"f/"+AP[A2]:null,solve!=="i"?"ISO "+IS[I2]:null].filter(Boolean).join(" and ");
   const what={s:"shutter speed",a:"aperture",i:"ISO"}[solve];
   const part=(n,b,c)=>{const x=c-b;return x?`${n} ${x>0?"+":""}${x}`:null;};
   const sh=-(S2-s),ap=-(A2-a),iso=I2-i;
   return{k:"mc",q:`Base exposure (N): ${SH[s]}, f/${AP[a]}, ISO ${IS[i]}. For N${d>0?"+":"−"}${Math.abs(d)}, you set ${given}. What ${what}?`,o:mcFrom(right,pool),
     e:`Count stops (+ = brighter). Shutter ${sh>=0?"+":""}${sh}, aperture ${ap>=0?"+":""}${ap}, ISO ${iso>=0?"+":""}${iso}: total ${sh+ap+iso>=0?"+":""}${sh+ap+iso} = N${d>0?"+":"−"}${Math.abs(d)}. So the ${what} is ${right}.`};}
  return GEN.tones();},
 rm(){const o=pk([10,15,20,24,30,40,50,60]),m=pk([0.25,0.5,1,2,3]),img=r1(o*m);
  return{k:"num",q:`${art(o)==="an"?"An":"A"} ${o} mm object is ${img} mm tall on the sensor. What is the scale of reproduction R? (2 decimals)`,a:m,tol:0.01,d:`${m} (${ratio(m)})`,e:`R = image size ÷ object size = ${img} ÷ ${o} = ${m}.`};}
};
const GQ=[
 ["G1","snr","snr","SNR from a patch's mean and standard deviation"],["G2","dsens","tones","Bit depth → number of tones"],["G3","raw","bits","Number of tones → bit depth"],
 ["G4","sensor","crop","Crop factor from a sensor's diagonal"],["G5","lens2","equiv","Equivalent focal length on a crop camera"],["G6","lens","lens","Focal length from u and v (1/f = 1/u + 1/v)"],
 ["G7","lab2","comb","Combined focal length of two lenses"],["G8","lens2","diop","Diopters ↔ focal length"],["G9","scale","scale","Image and object distance for a reproduction ratio"],
 ["G10","lab2","ruler","Scale of reproduction from a ruler (R = 24 ÷ width)"],["G11","aber","fnum","Aperture diameter from focal length and f-number"],["G12","aber","pin","Optimum pinhole diameter"],
 ["G13","aber","hyper","Sharp zone when focused at the hyperfocal distance"],["G14","lab2","hand","Handheld shutter rule"],["G15","lab2","isstop","Image stabilization stops"],
 ["G16","si","nd","ND filter density ↔ stops"],["G17","expo","expo","Equivalent exposure, changing two settings"],["G18","expo","expo","Equivalent exposure, changing two settings"],["G19","scale","rm","Scale of reproduction = image ÷ object"]
].map(([id,t,g,name])=>({id,t,k:"gen",g,q:"🎲 "+name+" (new numbers every time)",d:"Different numbers every time",e:""}));
Q.push(...GQ);
function inst(q){if(q.k!=="gen")return q;const tpl=q.tpl||q;const x=GEN[tpl.g]();return Object.assign({id:tpl.id,t:tpl.t,tpl,gen:true},x);}

const BYID={};Q.forEach(q=>BYID[q.id]=q);
const TWIN={};Q.forEach(q=>{if(q.rv&&BYID[q.rv]){TWIN[q.id]=q.rv;TWIN[q.rv]=q.id;}});
const TORD={};Object.keys(TOPICS).forEach((t,i)=>TORD[t]=i);
const QIDX={};Q.forEach((q,i)=>QIDX[q.id]=i);
function topicSort(list){return list.slice().sort((a,b)=>TORD[a.t]-TORD[b.t]||QIDX[a.id]-QIDX[b.id]);}

/* ---------- levels: new → learning / almost done → mastered → completed ---------- */
const LV=["new","learning","almost","mastered","completed"];
const LVN={new:"New",learning:"Learning",almost:"Almost done",mastered:"Mastered",completed:"Completed"};
const LVD={new:"Haven't seen it yet",learning:"Missed it the last time it counted",almost:"Right on the first try once",mastered:"Right on the first try twice in a row; now asked as free response",completed:"Free-response version right too; only comes back now and then"};
function lvl(q){const st=S.stats[q.id];if(!st)return "new";if(st.lv)return st.lv;
  if(st.last==="w")return "learning";const sk=st.streak!=null?st.streak:(st.last==="r"?1:0);return sk>=3?"mastered":"almost";}
function nextLv(cur,ok){if(!ok)return "learning";return {new:"almost",learning:"almost",almost:"mastered",mastered:"completed",completed:"completed"}[cur];}
function counts(list){const c={new:0,learning:0,almost:0,mastered:0,completed:0};list.forEach(q=>c[lvl(q)]++);return c;}
function sbar(c,tot){return `<div class="sbar">${["completed","mastered","almost","learning","new"].map(k=>c[k]?`<i class="lv-${k}" style="width:${c[k]/tot*100}%"></i>`:"").join("")}</div>`;}

/* ---------- SPD graphs ---------- */
function spdSVG(kind){
  const W=340,H=160,x0=36,x1=326,yb=130,yt=14,g=(l,c,w)=>Math.exp(-(((l-c)/w)**2));
  const f={
    tung:l=>0.04+0.96*((l-400)/300)**2.1,
    day:l=>0.62+0.3*g(l,465,55)-0.18*((l-400)/300)+0.025*Math.sin(l/7),
    fluor:l=>0.1+0.14*g(l,600,60)+0.08*g(l,480,40)+0.45*g(l,405,2.5)+0.8*g(l,436,2.5)+1*g(l,546,2.5)+0.35*g(l,578,3)+0.7*g(l,611,3)
  }[kind];
  const pts=[];let max=0;for(let l=400;l<=700;l++){const v=f(l);max=Math.max(max,v);pts.push([l,v]);}
  const X=l=>x0+(l-400)/300*(x1-x0),Y=v=>yb-(v/max)*(yb-yt);
  const line=pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
  const area=`${x0},${yb} ${line} ${x1},${yb}`;
  let ticks="";[400,500,600,700].forEach(l=>{ticks+=`<line x1="${X(l)}" y1="${yb}" x2="${X(l)}" y2="${yb+4}"/><text x="${X(l)}" y="${yb+16}" text-anchor="middle">${l}</text>`;});
  return `<svg class="spd" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spectral power distribution graph">
    <line x1="${x0}" y1="${yb}" x2="${x1}" y2="${yb}"/><line x1="${x0}" y1="${yt}" x2="${x0}" y2="${yb}"/>
    <polygon class="area" points="${area}"/><polyline class="curve" points="${line}"/>${ticks}
    <text x="${(x0+x1)/2}" y="${H-2}" text-anchor="middle">wavelength (nm)</text>
    <text x="12" y="${(yt+yb)/2}" text-anchor="middle" transform="rotate(-90 12 ${(yt+yb)/2})">power</text></svg>`;
}

/* ---------- picking: practice attempts ---------- */
function addTwins(list){
  const have=new Set(list.map(q=>q.id)),out=list.slice();
  list.forEach(q=>{const t=TWIN[q.id];if(t&&!have.has(t)&&Math.random()<0.5){have.add(t);const at=out.indexOf(q)+1+Math.floor(Math.random()*(out.length-out.indexOf(q)));out.splice(at,0,BYID[t]);}});
  return out;
}
function pick(mode){
  if(mode==="miss")return shuffle(Q.filter(q=>lvl(q)==="learning"));
  if(mode==="all")return shuffle(Q);
  let out=[];const W={new:2,learning:3,almost:1,mastered:0.3,completed:0};
  for(const t in TOPICS){
    const pool=shuffle(Q.filter(q=>q.t===t)).map(q=>({q,p:Math.random()+W[lvl(q)]}));
    pool.sort((a,b)=>b.p-a.p);out=out.concat(pool.slice(0,5).map(x=>x.q));
  }
  return addTwins(shuffle(out));
}

/* ---------- picking: learn sets (Quizlet-style) ---------- */
function learnPool(){
  let pool=Q.slice();
  if(S.L.dir==="normal")pool=pool.filter(q=>!q.rv);
  else if(S.L.dir==="flip")pool=pool.filter(q=>!(TWIN[q.id]&&!q.rv));
  if(S.L.starred)pool=pool.filter(q=>S.star[q.id]);
  return pool;
}
function learnPick(){
  const n=S.L.size,pool=learnPool();if(!pool.length)return [];
  const by={};LV.forEach(k=>by[k]=[]);pool.forEach(q=>by[lvl(q)].push(q));
  LV.forEach(k=>{by[k]=k==="new"&&!S.L.shuffle?topicSort(by[k]):shuffle(by[k]);});
  // learning gets the most, then new, then almost done, mastered, completed
  const share={learning:.36,new:.28,almost:.18,mastered:.12,completed:.06},order=["learning","new","almost","mastered","completed"];
  const want={};let tot=0;order.forEach(k=>{want[k]=Math.floor(n*share[k]);tot+=want[k];});
  for(const k of order){if(tot>=n)break;want[k]++;tot++;}
  const out=[];order.forEach(k=>{out.push(...by[k].splice(0,want[k]));});
  for(const k of order){while(out.length<n&&by[k].length)out.push(by[k].shift());}
  return S.L.shuffle?shuffle(out):topicSort(out);
}

/* ---------- how a card is shown ---------- */
function formatFor(q){
  const L=lvl(q),typedOK=q.k==="mc"||q.k==="fill"||q.k==="num"||q.k==="seq";
  if(run.mode==="group")return "native";
  if(run.mode!=="learn"){
    if(q.k==="mc"&&(S.mode==="type"||(S.mode==="auto"&&(L==="mastered"||L==="completed"))))return "written";
    return "native";
  }
  if((L==="mastered"||L==="completed")&&typedOK)return "written";
  const T=S.L.types,opts=[];
  if(q.k==="mc"){if(T.mc)opts.push("native");if(T.written)opts.push("written");if(T.tf)opts.push("tfs");if(T.flash)opts.push("flash");}
  else if(q.k==="fill"||q.k==="num"||q.k==="seq"){if(T.written||T.mc||T.tf)opts.push("native");if(T.flash)opts.push("flash");}
  else{if(T.mc||T.tf||T.written)opts.push("native");if(T.flash)opts.push("flash");}
  return opts.length?opts[Math.floor(Math.random()*opts.length)]:"native";
}

  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(run.done)return;
    if(q.k==="multi"&&f!=="tfs"){const i=+b.dataset.i;run.sel.has(i)?run.sel.delete(i):run.sel.add(i);b.classList.toggle("sel");}
    else{document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");run.sel=b.dataset.i;}
  });
  if(f==="flash")$("#reveal").onclick=()=>{run.done=true;$("#reveal").disabled=true;
    $("#fb").innerHTML=`<div class="fb" style="background:var(--accent-soft);border:1px solid var(--accent)"><strong>Answer</strong><div><b>${esc(answerText(q))}</b></div><div>${esc(q.e)}</div><div class="selfg"><button class="btn okb" id="sg1">✓ I knew it</button><button class="btn nob" id="sg0">✗ I didn't</button></div></div>`;
    $("#sg1").onclick=()=>finish(q,true,"(flashcard)",false);$("#sg0").onclick=()=>finish(q,false,"(flashcard)",false);$("#sg1").focus();};
  $("#check").onclick=()=>run.done?next():check();
  const inp=$("#ans");if(inp)inp.focus();
}

function typedGrade(q,v){
  const sq=x=>norm(x).replace(/^(a|an|the) /,"").replace(/[^a-z0-9./%:+-]/g,"");
  const key=q.o[0],main=key.replace(/\s*\([^)]*\)/g,"").trim(),u=sq(v);
  const cands=[key,main].concat(q.alt||[]).map(sq).filter(Boolean);
  if(cands.some(c=>c===u))return true;
  const nums=x=>(norm(x).replace(/,/g,"").match(/\d*\.?\d+/g)||[]).join("|");
  const kn=nums(main),un=nums(v),words=main.split(/\s+/).length;
  if(kn&&kn===un&&words<=4)return true;
  if(words<=3){const m=sq(main);if(m.length>=4&&u.includes(m))return true;
    if(m.length>4&&lev(m,u)<=2)return "spell";return false;}
  return "self";
}
function gradeText(q,v){ // for fill / num / seq and typed mc; returns true | false | "spell" | "self"
  if(run.typed)return typedGrade(q,v);
  if(q.k==="num"){const m=v.replace(/,/g,"").match(/-?\d*\.?\d+/);return !!m&&Math.abs(parseFloat(m[0])-q.a)<=q.tol+1e-9;}
  if(q.k==="seq"){const t=seqTokens(v),a=q.a.map(x=>norm(x));return t.length===a.length&&t.every((x,i)=>x===a[i]);}
  const n=norm(v).replace(/^(a|an|the) /,""),ns=n.replace(/\s/g,"");
  if(q.a.some(a=>norm(a).replace(/\s/g,"")===ns))return true;
  if(q.a.some(a=>{const as=norm(a).replace(/\s/g,"");return as.length>4&&lev(as,ns)<=2;}))return "spell";
  return false;
}
function check(){
  const q=run.qs[run.i],f=run.fmt;let ok=false,given="",spell=false,smart=false;
  if(f==="tfs"){if(run.sel===null)return;const isRight=run.claim===0;ok=(run.sel==="t")===isRight;given=(run.sel==="t"?"True":"False")+": "+q.o[run.claim];}
  else if($("#ans")){const v=$("#ans").value;if(!v.trim())return;given=v;$("#ans").disabled=true;
    const g=gradeText(q,v);
    if(g==="self"){run.done=true;$("#check").hidden=true;
      $("#fb").innerHTML=`<div class="fb" style="background:var(--accent-soft);border:1px solid var(--accent)"><strong>Compare</strong><div>Key: <b>${esc(q.o[0])}</b></div><div>${esc(q.e)}</div><div class="selfg"><button class="btn okb" id="sg1">✓ I got it</button><button class="btn nob" id="sg0">✗ I missed it</button></div></div>`;
      $("#sg1").onclick=()=>finish(q,true,given,false);$("#sg0").onclick=()=>finish(q,false,given,false);$("#sg1").focus();return;}
    if(g==="spell"&&S.L.smart&&run.mode==="learn"){ok=true;smart=true;}else{ok=g===true;spell=g==="spell";}}
  else if(q.k==="mc"||q.k==="spd"){if(run.sel===null)return;ok=run.sel==="0";given=q.o[+run.sel];}
  else if(q.k==="tf"){if(run.sel===null)return;ok=(run.sel==="t")===q.a;given=run.sel==="t"?"True":"False";}
  else if(q.k==="multi"){if(!run.sel.size)return;ok=run.sel.size===q.c.length&&q.c.every(i=>run.sel.has(i));given=[...run.sel].map(i=>q.o[i]).join(", ");}
  run.done=true;finish(q,ok,given,spell,smart);
}

/* record one answer; first try in this run decides the level */
function record(q,ok){
  const first=!run.first.has(q.id);run.first.add(q.id);
  const snap=S.stats[q.id]?JSON.stringify(S.stats[q.id]):null;
  const st=S.stats[q.id]||{right:0,wrong:0};const cur=lvl(q);
  ok?st.right++:st.wrong++;st.last=ok?"r":"w";
  if(first)st.lv=nextLv(cur,ok);else if(!ok)st.lv="learning";else st.lv=st.lv||cur;
  S.stats[q.id]=st;save();
  let ins=-1;
  let insObj=null;
  if(run.mode==="learn"){if(ok)run.left.delete(q.id);else{run.left.add(q.id);ins=Math.min(run.i+3,run.qs.length);insObj=q.tpl||q;run.qs.splice(ins,0,insObj);}}
  return {first,snap,ins,insObj,from:cur};
}
function undo(q,info){
  if(info.snap)S.stats[q.id]=JSON.parse(info.snap);else delete S.stats[q.id];
  if(info.first)run.first.delete(q.id);
  if(info.ins>=0&&run.qs[info.ins]===info.insObj)run.qs.splice(info.ins,1);
}
function finish(q,ok,given,spell,smart){
  $("#check").hidden=false;
  const f=run.fmt;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=b.dataset.i;
    const correct=f==="tfs"?(i==="t")===(run.claim===0):(q.k==="mc"||q.k==="spd")?i==="0":q.k==="tf"?(i==="t")===q.a:q.k==="multi"?q.c.includes(+i):false;
    if(correct)b.classList.add("right");else if(b.classList.contains("sel"))b.classList.add("wrong");});
  let info=record(q,ok);
  run.results.push({q,ok,given});const ri=run.results.length-1;
  const paint=()=>{const r=run.results[ri],L=lvl(q),moved=info.first&&L!==info.from;
    $("#fb").innerHTML=`<div class="fb ${r.ok?"ok":"no"}"><strong>${r.ok?"Correct":"Not quite"}</strong>
      ${smart&&r.ok?`<div class="spell">Accepted with a small typo (Smart grading). On the exam this would be wrong: spell it “${esc(answerText(q))}”.</div>`:""}
      ${spell?`<div class="spell">Close. Check your spelling, because spelling counts on the exam.</div>`:""}
      ${r.ok&&f!=="tfs"?"":`<div>Answer: <b>${esc(answerText(q))}</b></div>`}
      <div>${esc(q.e)}</div>
      <div class="lvmove">${moved?`Level: ${LVN[info.from]} → <b>${LVN[L]}</b>`:`Level: <b>${LVN[L]}</b>`}${run.mode==="learn"&&!r.ok?" · it will come back in this round":""}</div>
      <div class="btns"><button type="button" class="linkbtn" id="ovr">${r.ok?"Mark wrong (see it sooner)":"I was right (override)"}</button></div>
      ${!r.ok&&S.L.retype&&run.mode==="learn"?`<div class="stack" style="gap:6px"><label for="rt" class="hint">Retype the right answer to continue:</label><input type="text" id="rt" autocomplete="off" spellcheck="false"></div>`:""}
    </div>`;
    const nb=$("#check");nb.textContent=run.i+1<run.qs.length?"Next":run.mode==="learn"?"Finish round":"See results";
    const rt=$("#rt");
    if(rt){nb.disabled=true;rt.oninput=()=>{const v=rt.value;const target=norm(answerText(q)).replace(/\s/g,""),u=norm(v).replace(/\s/g,"");
        const okk=u===target||(q.k==="fill"&&q.a.some(a=>norm(a).replace(/\s/g,"")===u))||(q.k==="num"&&v.replace(/,/g,"").match(/-?\d*\.?\d+/)&&Math.abs(parseFloat(v.replace(/,/g,"").match(/-?\d*\.?\d+/)[0])-q.a)<=q.tol+1e-9)||(target.length>12&&lev(target,u)<=3);
        nb.disabled=!okk;rt.classList.toggle("good",!!okk);};rt.focus();}
    else{nb.disabled=false;nb.focus();}
    $("#ovr").onclick=()=>{undo(q,info);const nok=!run.results[ri].ok;run.results[ri].ok=nok;info=record(q,nok);smart=false;spell=false;paint();};
  };
  paint();
}

function next(){run.i++;if(run.i<run.qs.length)show();else if(run.mode==="learn")learnDone();else results();}
function tilesHTML(c){return `<div class="tiles">${["new","learning","almost","mastered","completed"].map(k=>`<div class="tile lv-${k}"><b>${c[k]}</b><span>${LVN[k]}</span></div>`).join("")}</div>`;}
function topicBars(){let h="";for(const t in TOPICS){const qs=Q.filter(q=>q.t===t),c=counts(qs);h+=`<div class="tb"><span>${TOPICS[t]}</span>${sbar(c,qs.length)}<span class="pct">${c.mastered+c.completed}/${qs.length}</span></div>`;}return h;}

/* ---------- group sessions (same code = same questions) ---------- */
function parseCode(c){const m=/^([A-Z]+)-(\d{4})-(\d{1,3})$/.exec(c);if(!m)return null;const n=+m[3];return n>=1&&n<=100?{n}:null;}
function startGroup(code){
  const p=parseCode(code);RNG=seeded(hashStr(code));
  try{
    const base=Q.filter(q=>!q.rv),by={};base.forEach(q=>{(by[q.t]=by[q.t]||[]).push(q);});
    const tops=rshuffle(Object.keys(by).sort());tops.forEach(t=>{by[t]=rshuffle(by[t]);});
    const list=[];let k=0;while(list.length<p.n&&tops.some(t=>by[t].length)){const t=tops[k%tops.length];if(by[t].length)list.push(by[t].shift());k++;}
    const qs=list.map(q=>{const x=Object.assign({},inst(q));if(x.k==="mc"||x.k==="spd"||x.k==="multi")x._order=rshuffle(x.o.map((_,i)=>i));return x;});
    confirmReset=false;run=newRun("group",qs,{code});
  }finally{RNG=Math.random;}
  show();
}
function learnDone(){
  run.all=run.all.concat(run.results);
  const first={};run.results.forEach(x=>{if(!(x.q.id in first))first[x.q.id]=x.ok;});
  const ids=Object.keys(first),firstRight=ids.filter(i=>first[i]).length;
  $("#app").innerHTML=`
  <header class="head"><div><div class="eyebrow">Learn · round ${run.set} done</div><h1>Round complete</h1></div></header>
  <section class="card stack">
    <div class="score">${ids.length}<span class="muted" style="font-size:.45em">/${ids.length} right at least once</span></div>
    <p style="margin:0"><b>${firstRight}</b> right on the first try (moved up a level), <b>${ids.length-firstRight}</b> went to <b>Learning</b> and will show up more in the next rounds.</p>
    <div class="btns"><button class="btn" id="more">Continue (next ${S.L.size})</button><button class="btn ghost" id="rep">📊 What I know</button><button class="btn ghost" id="home">Done</button></div>
  </section>
  <section class="card stack"><h2>Overall</h2>${tilesHTML(counts(Q))}</section>`;
  const n=run.set;$("#more").onclick=()=>startLearn(n+1);$("#rep").onclick=()=>report(run.all);$("#home").onclick=home;window.scrollTo(0,0);
}

/* ---------- progress report ---------- */
function termHTML(q){return `<div class="term"><div><span class="tag">${TOPICS[q.t]}</span>${S.star[q.id]?' <span class="tag">★</span>':""}</div><div>${esc(q.q)}</div><div class="ans">${esc(answerText(q))}</div></div>`;}
function report(sess){
  const c=counts(Q);let sessHTML="";
  if(sess&&sess.length){const ids={};sess.forEach(x=>{ids[x.q.id]=x;});const seen=Object.values(ids).map(x=>x.q),sc=counts(seen),right=sess.filter(x=>x.ok).length;
    sessHTML=`<section class="card stack"><h2>This session</h2><p style="margin:0"><b>${right}</b> right out of <b>${sess.length}</b> answers on <b>${seen.length}</b> questions. Where they stand now:</p>${tilesHTML(sc)}
    ${["learning","almost","mastered","completed"].map(k=>{const L=seen.filter(q=>lvl(q)===k);return L.length?`<details class="cat lv-${k}" ${k==="learning"?"open":""}><summary>${LVN[k]} from this session (${L.length})</summary>${L.map(termHTML).join("")}</details>`:"";}).join("")}</section>`;}
  $("#app").innerHTML=`
  <header class="head"><div><div class="eyebrow">Exam 2 · progress report</div><h1>What I know</h1></div><button class="btn ghost" id="home">Back</button></header>
  ${sessHTML}
  <section class="card stack"><h2>All ${Q.length} questions</h2>${tilesHTML(c)}
    <div class="legend">${LV.map(k=>`<span class="lv-${k}"><b>${LVN[k]}</b>: ${LVD[k].toLowerCase()}</span>`).join("")}</div>
    <div class="bars">${topicBars()}</div>
    <div class="btns"><button class="btn" id="learn">Keep learning (${S.L.size})</button></div></section>
  <section class="card stack"><h2>The questions</h2><p class="hint" style="margin:0">Open a group to see each question and its answer.</p>
    ${["learning","new","almost","mastered","completed"].map(k=>{const L=Q.filter(q=>lvl(q)===k);return `<details class="cat lv-${k}"><summary>${LVN[k]} (${L.length})</summary>${L.length?L.map(termHTML).join(""):'<p class="hint">None yet.</p>'}</details>`;}).join("")}
  </section>`;
  run=null;$("#home").onclick=home;$("#learn").onclick=()=>startLearn(1);window.scrollTo(0,0);
}

function results(){
  const r=run.results,score=r.filter(x=>x.ok).length,total=r.length,pct=Math.round(score/total*100);
  if(run.mode==="attempt"){S.attempts.push({score,total,date:new Date().toISOString()});save();}
  let byT="";for(const t in TOPICS){const x=r.filter(y=>y.q.t===t);if(!x.length)continue;const s=x.filter(y=>y.ok).length,p=Math.round(s/x.length*100);
    byT+=`<div class="bar"><span>${TOPICS[t]}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><span class="pct">${s}/${x.length}</span></div>`;}
  const missed=r.filter(x=>!x.ok);
  const verdict=pct>=90?"Exam ready on this set.":pct>=75?"Solid. Keep learning your misses, then take the next one.":"Review the misses below, then go again.";
  $("#app").innerHTML=`
  <header class="head"><div><div class="eyebrow">${run.mode==="group"?`Group session ${run.code}`:run.mode==="attempt"?`Practice exam ${S.attempts.length} of 7`:run.mode==="miss"?"Learning round":"All questions"}</div><h1>Results</h1></div></header>
  <section class="card stack">
    <div class="score">${score}<span class="muted" style="font-size:.45em">/${total}</span></div>
    <p style="margin:0"><b>${pct}%</b>. ${verdict}</p>
    <div class="bars">${byT}</div>
    <div class="btns"><button class="btn" id="home">Back</button><button class="btn ghost" id="rep">📊 What I know</button></div>
  </section>
  ${missed.length?`<section class="card stack"><h2>What you missed (${missed.length})</h2>
    ${missed.map(x=>`<div class="miss"><div><span class="tag">${TOPICS[x.q.t]}</span></div><div>${esc(x.q.q)}</div>
      <div class="you">You: ${esc(x.given)}</div><div class="ans">Answer: ${esc(answerText(x.q))}</div><div class="hint">${esc(x.q.e)}</div></div>`).join("")}
  </section>`:""}`;
  $("#home").onclick=home;const rr=r;$("#rep").onclick=()=>report(rr);
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!run||e.key!=="Enter")return;
  const b=$("#check");if(b&&!b.hidden&&!b.disabled){e.preventDefault();b.click();}
});
home();
</script>
