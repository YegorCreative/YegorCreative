<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam 2 Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E8EAED; --surface:#FFFFFF; --ink:#15181C; --muted:#59616B; --line:#D2D6DC;
  --accent:#C4611A; --accent-ink:#FFFFFF; --accent-soft:#F6E4D6;
  --good:#2B7A4B; --good-bg:#E2F1E7; --bad:#B0261D; --bad-bg:#F8E0DD; --warn:#8A6100;
  --gray18:#777B7F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121417; --surface:#1B1E22; --ink:#E6E8EB; --muted:#9BA3AE; --line:#2D3238;
    --accent:#F08A3C; --accent-ink:#1A0E04; --accent-soft:#3A2515;
    --good:#72D09A; --good-bg:#142A1E; --bad:#FF8C82; --bad-bg:#301816; --warn:#E6B94F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121417; --surface:#1B1E22; --ink:#E6E8EB; --muted:#9BA3AE; --line:#2D3238;
  --accent:#F08A3C; --accent-ink:#1A0E04; --accent-soft:#3A2515;
  --good:#72D09A; --good-bg:#142A1E; --bad:#FF8C82; --bad-bg:#301816; --warn:#E6B94F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,7vw,3.4rem);text-transform:uppercase}
h2{font-size:1.6rem}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.chip18{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.chip18 i{display:block;width:28px;height:28px;border-radius:4px;background:var(--gray18)}
/* attempts */
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot.done{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.dot.next{border-style:solid;border-color:var(--ink);color:var(--ink)}
.dot small{font-size:.62rem;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* mastery */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:.9rem}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.bar .pct{font-family:var(--mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:480px){.bar{grid-template-columns:110px 1fr 40px}}
.rules{margin:0;padding-left:18px;display:grid;gap:4px}
/* quiz */
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);padding:4px 8px;border-radius:4px}
.qtext{font-size:1.2rem;font-weight:500;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt .key{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:1.2em;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted)}
.fb{border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.spell{color:var(--warn);font-weight:600}
.spd{width:100%;max-width:420px;height:auto;color:var(--muted)}
.spd .curve{fill:none;stroke:var(--accent);stroke-width:2}
.spd .area{fill:var(--accent);fill-opacity:.15}
.spd text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.spd line{stroke:var(--line)}
/* results */
.score{font-family:var(--display);font-size:clamp(3.5rem,14vw,5.5rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.miss{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.miss .you{color:var(--bad)} .miss .ans{color:var(--good);font-weight:500}
.stack{display:grid;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border-radius:8px;padding:10px 12px;border:1px solid var(--line);display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:2rem;line-height:1}
.tile span{font-size:.82rem;color:var(--muted)}
.st-m{--c:#2B7A4B}.st-l{--c:#C99A1C}.st-n{--c:#B0261D}.st-u{--c:#8A9099}
.tile.st-m,.tile.st-l,.tile.st-n,.tile.st-u{border-left:6px solid var(--c)}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.sbar i{display:block;height:100%;background:var(--c)}
.tb{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.9rem}
.tb .pct{font-family:var(--mono);font-size:.78rem;text-align:right;color:var(--muted)}
@media (max-width:480px){.tb{grid-template-columns:1fr 64px}.tb .sbar{grid-column:1/-1;grid-row:2}}
details.cat{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:10px 14px}
details.cat summary{cursor:pointer;font-weight:600}
.term{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:2px;font-size:.92rem}
.term .ans{color:var(--good);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
.mode{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.stack>.mode{display:flex}.stack>.mode button{flex:1 1 0}
.mode button{border:0;border-radius:0;background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tag.flip{background:var(--ink);color:var(--surface);margin-left:6px}
.selfg{display:flex;gap:10px;flex-wrap:wrap}
.selfg .btn.okb{background:var(--good);color:#fff}.selfg .btn.nob{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.togs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.togs{grid-template-columns:1fr}}
.tog{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.tog input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.tog span{display:grid;gap:2px}.tog small{color:var(--muted);font-size:.8rem;line-height:1.35}
.szrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.szrow input{width:110px;font:inherit;font-size:1.2rem;font-weight:600;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.star{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:1.2rem;color:var(--warn);flex:none}
.star[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.claim{border:1.5px dashed var(--accent);border-radius:8px;padding:12px 14px;font-weight:600;background:var(--accent-soft)}
.claim::before{content:"Proposed answer: ";font-weight:400;color:var(--muted)}
.lvmove{font-size:.9rem;color:var(--muted)}
.linkbtn{background:none;border:none;padding:0;color:var(--ink);text-decoration:underline;font-size:.9rem;cursor:pointer}
input.good{border-color:var(--good)!important;background:var(--good-bg)!important}
.lv-new{--c:#8A9099}.lv-learning{--c:#B0261D}.lv-almost{--c:#C99A1C}.lv-mastered{--c:#2B7A4B}.lv-completed{--c:#1F5FB0}
.tag.lv{background:transparent;border:1px solid var(--c);color:var(--ink);margin-left:6px}
.tiles{grid-template-columns:repeat(5,minmax(0,1fr))!important}
@media (max-width:620px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media (max-width:400px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.tile.lv-new,.tile.lv-learning,.tile.lv-almost,.tile.lv-mastered,.tile.lv-completed{border-left:6px solid var(--c)}
details.cat.lv-new,details.cat.lv-learning,details.cat.lv-almost,details.cat.lv-mastered,details.cat.lv-completed{border-left:6px solid var(--c)}
.legend span{display:block}
</style>
</head><body>

<div class="wrap" id="app"></div>

<script>
const TOPICS={snr:"Noise & SNR",measure:"Measuring noise",iso:"ISO & noise reduction",sensor:"Sensor size",expo:"Exposure & bracketing",cfa:"Color filters, noise types, ETTR & HDR",raw:"RAW, bits & DNG",fmt:"File formats",comp:"Compression & artifacts",lens:"Light & lenses",scale:"Scale of reproduction & angle of view",dsens:"Digital sensors (CCD vs CMOS, bit depth)",lens2:"Lens types, crop factor & diopters",lab2:"Lab 2: Nodal points & lens types lab",si:"SI practice exam",pick:"★ Her test picks",aber:"Aberrations, diffraction & depth of field"};
const ISO=["100","200","400","800","1600","3200","6400"];
const SHUT=["1","1/2","1/4","1/8","1/15","1/30","1/60","1/125","1/250","1/500","1/1000"];
const APER=["1.4","2","2.8","4","5.6","8","11","16","22","32"];
// first mc option is the correct one (shuffled on screen)
const Q=[
{id:"AB1",t:"aber",k:"mc",q:"An anamorphic lens on a movie camera…",o:["Squeezes a wide scene so it fits on standard film","Stretches the image for the audience","Adds bokeh to the background","Removes chromatic aberration"],e:"The camera lens squeezes; the projector's anamorphic lens stretches it back out."},
{id:"AB2",t:"aber",k:"fill",q:"The quality of the blur in out-of-focus areas is called ________.",a:["bokeh"],e:"Bokeh. It's determined by lens aberrations and the aperture. Spelling counts!"},
{id:"AB3",t:"aber",k:"mc",q:"Left alone, bokeh usually takes the shape of…",o:["The aperture","The sensor","The lens hood","The subject"],e:"Out-of-focus points copy the shape of the aperture blades (or a cutout)."},
{id:"AB4",t:"aber",k:"mc",q:"In chromatic aberration, which wavelengths bend the most?",o:["Short (blue)","Long (red)","Middle (green)","They all bend equally"],e:"Blue bends most, red least, green in between."},
{id:"AB5",t:"aber",k:"mc",q:"Where is the sensor usually placed to deal with chromatic aberration?",o:["Where green comes to focus","Where red comes to focus","Where blue comes to focus","Halfway between the lens and the red focus"],e:"Green has the most pixels and our vision is most sensitive to it."},
{id:"AB6",t:"aber",k:"fill",q:"A positive and a negative lens cemented together to correct chromatic aberration is an achromatic ________.",a:["doublet"],e:"Achromatic doublet: crown glass (positive) + flint glass (negative)."},
{id:"AB7",t:"aber",k:"mc",q:"Which does NOT help reduce chromatic aberration?",o:["Raising the ISO","An achromatic doublet","The aperture cutting off outer rays","Lens coatings"],e:"Her three fixes: the doublet, the aperture and coatings."},
{id:"AB8",t:"aber",k:"mc",q:"Spherical aberration is when…",o:["Rays through different parts of the lens focus at different points","Different colors focus at different points","Straight lines bulge outward","Light spreads through a small hole"],e:"It mostly depends on the quality of the optics, so cheaper lenses show more."},
{id:"AB9",t:"aber",k:"mc",q:"Lines that bulge outward at the edges, as with a fisheye lens, are…",o:["Barrel distortion","Pincushion distortion","Spherical aberration","Diffraction"],e:"Barrel: magnification decreases with distance from the optical axis."},
{id:"AB10",t:"aber",k:"mc",q:"Glasses for a nearsighted person (negative lenses) cause which distortion?",o:["Pincushion","Barrel","Chromatic","Anamorphic"],e:"Pincushion: lines curve in, like a sewing pincushion."},
{id:"AB11",t:"aber",k:"num",q:"Optimum pinhole diameter (inches) for a pinhole 9 inches from the film? (3 decimals)",a:0.021,tol:0.0015,d:"0.021 in",e:"D = √f ÷ 141 = 3 ÷ 141 ≈ 0.0213 in."},
{id:"AB12",t:"aber",k:"num",q:"Optimum pinhole diameter (mm) for a pinhole 196 mm from the sensor? (1 decimal)",a:0.5,tol:0.05,d:"0.5 mm",e:"D = √f ÷ 28 = 14 ÷ 28 = 0.5 mm."},
{id:"AB13",t:"aber",k:"mc",q:"When the softening from diffraction cancels the sharpness gained by stopping down, you've reached the lens's…",o:["Diffraction limit","Hyperfocal distance","Circle of confusion","Nodal point"],e:"Going smaller than that makes the image softer, not sharper."},
{id:"AB14",t:"aber",k:"tf",q:"The smallest aperture on a lens (e.g. f/22) always gives the sharpest image.",a:false,e:"False. Diffraction softens tiny apertures. Find your lens's sweet spot."},
{id:"AB15",t:"aber",k:"mc",q:"The permissible circle of confusion is…",o:["The largest circle that still appears as a point","The smallest circle the lens can make","The size of the aperture","The image circle that covers the sensor"],e:"Your eye's limited resolving power makes small circles look like points."},
{id:"AB16",t:"aber",k:"mc",q:"Which change gives you MORE depth of field?",o:["Stopping down to a smaller aperture","Moving closer to the subject","Using a longer focal length","Opening up to f/2"],e:"Smaller aperture, farther away, shorter lens = more depth of field."},
{id:"AB17",t:"aber",k:"mc",q:"A 200 mm lens at f/4 has an aperture diameter of…",o:["50 mm","800 mm","4 mm","20 mm"],e:"D = f ÷ N = 200 ÷ 4 = 50 mm."},
{id:"AB18",t:"aber",k:"mc",q:"The hyperfocal distance is…",o:["The closest distance that appears sharp when the lens is focused at infinity","The distance from the lens to the sensor","The farthest distance a lens can focus","Half the focal length"],e:"Focus there and everything from half of it to infinity is sharp."},
{id:"AB19",t:"aber",k:"num",q:"The hyperfocal distance is 24 ft. You focus at 24 ft. Everything is sharp from how many feet to infinity?",a:12,tol:0,d:"12 ft",e:"Half the hyperfocal distance: 24 ÷ 2 = 12 ft."},
{id:"AB20",t:"aber",k:"mc",q:"Your camera is on a tripod with a mechanically stabilized lens. You should…",o:["Turn image stabilization off","Turn it on to maximum","Use a slower ISO","Turn on IS and raise the shutter speed"],e:"Mechanical IS adds motion and wobble on a tripod and can damage the gear."},
{id:"TP13",t:"pick",k:"mc",q:"Which list gives the four things that affect the circle of confusion?",o:["Eyesight, contrast, level of illumination, the viewer's opinion","Aperture, focal length, distance, ISO","Sensor size, bit depth, ISO, contrast","Eyesight, shutter speed, focal length, color"],e:"Her \"beautiful test question\". Hook: Every Coffee Looks Okay."},
{id:"TP14",t:"pick",k:"mc",q:"What are the three depth of field controls?",o:["Aperture, object distance, focal length","Aperture, shutter speed, ISO","Focal length, ISO, white balance","Object distance, file format, sensor size"],e:"Her other \"beautiful test question\"."},
{id:"TP1",t:"pick",k:"fill",q:"RATS: light can be Reflected, Absorbed, Transmitted or ________.",a:["scattered"],e:"Her \"excellent test question\". Scattered = redirected by dust or water (fog + headlights)."},
{id:"TP2",t:"pick",k:"mc",q:"What happens to light that is absorbed?",o:["It turns into heat","It bounces off at the same angle","It passes straight through","It is redirected by dust"],e:"Absorbed light becomes heat. A black shirt in the sun gets hot."},
{id:"TP3",t:"pick",k:"mc",q:"Compared with a JPEG of the same shot, the RAW file has…",o:["Higher dynamic range, lower contrast, less sharpness, not ready for output","Lower dynamic range and higher contrast","More sharpness and more contrast","The same look, just a bigger file"],e:"Her \"really good test question\"."},
{id:"TP4",t:"pick",k:"mc",q:"Which is bigger: the RAW data or the demosaiced image?",o:["The demosaiced image (3 channels per pixel vs 1)","The RAW data","They are always the same size","It depends on the ISO"],e:"Demosaicing creates red, green and blue at every pixel."},
{id:"TP5",t:"pick",k:"fill",q:"An 8-bit channel holds values from 0 to ____.",a:["255"],e:"256 levels, numbered 0–255."},
{id:"TP6",t:"pick",k:"fill",q:"Re-saving a JPEG over and over causes ____________ degradation.",a:["generational","generation"],e:"Generational degradation. Spelling counts!"},
{id:"TP7",t:"pick",k:"mc",q:"TIFF vs JPEG: which one supports transparency and is better for repeated editing?",o:["TIFF","JPEG","Both equally","Neither"],e:"TIFF. JPEG has no transparency and degrades every save."},
{id:"TP8",t:"pick",k:"mc",q:"A lens that is thinner in the center than at the edges…",o:["Is negative (concave), diverges light and can't form a real image alone","Is positive and converges light","Forms a real image by itself","Can start a fire with sunlight"],e:"Negative = concave = diverges."},
{id:"TP9",t:"pick",k:"num",q:"Your calculator shows 1/u + 1/v = 0.0125. What is the focal length (mm)?",a:80,tol:0.5,d:"80 mm",e:"Press 1/x: 1 ÷ 0.0125 = 80 mm."},
{id:"TP10",t:"pick",k:"mc",q:"In a (normal) telephoto lens design…",o:["The positive element is in front of the negative, so the rear nodal point falls in front of the lens","The negative element is in front","The rear nodal point falls behind the lens","There is only one element"],e:"Her \"very good test question\". Swap them and you get retrofocus (reverse telephoto)."},
{id:"TP11",t:"pick",k:"mc",q:"Why are most DSLR wide-angle lenses retrofocus designs?",o:["The rear nodal point falls behind the lens, so the lens clears the mirror","It makes them lighter","It removes all distortion","It gives a fixed aperture"],e:"A short focal length would otherwise put the lens inside the mirror box."},
{id:"TP12",t:"pick",k:"mc",q:"You want to change the PERSPECTIVE of a portrait. What do you change?",o:["Camera position (distance)","Focal length","Aperture","ISO"],e:"Focal length changes framing; only camera position changes perspective."},
{id:"LB1",t:"lab2",k:"mc",q:"Lab 2 uses a nodal slide: the lens sits on a rail over a pivot, aimed at a distant light, and projects an image onto a screen. When you swing the lens left and right, the image on the screen stays still. Where is the pivot?",o:["Directly under the rear (image) nodal point","Directly under the front glass element","Under the aperture blades","Halfway between the lens and the screen"],e:"Swinging around the rear nodal point doesn't move the image. That's how you find it."},
{id:"LB2",t:"lab2",k:"num",q:"On a nodal slide (a lens on a rail over a pivot, projecting onto a screen), the image stops moving when you swing the lens, and the pivot is 82 mm from the screen. The lens is focused at infinity. What is the focal length (mm)?",a:82,tol:0.5,d:"82 mm",e:"Focused at infinity, focal length = rear nodal point → image plane."},
{id:"LB3",t:"lab2",k:"mc",q:"On a nodal slide, you swing the lens on its pivot and the projected image moves the SAME way the lens swings. What does that tell you?",o:["The pivot is not on the nodal point yet; slide the lens and test again","The lens is perfectly aligned","The lens is a negative lens","The screen is out of focus"],e:"Any image movement means the pivot is off the rear nodal point. Slide the lens along the rail until the image stays still."},
{id:"LB4",t:"lab2",k:"num",q:"You put a 150 mm lens and a 300 mm lens together (touching). What is the combined focal length (mm)?",a:100,tol:0.5,d:"100 mm",e:"1/fc = 1/150 + 1/300 = 3/300, so fc = 100 mm."},
{id:"LB5",t:"lab2",k:"mc",q:"You measure the focal length of two lenses held together, then calculate it with 1/fc = 1/f1 + 1/f2. Why is the measured value a little different from the calculated one?",o:["The formula assumes thin lenses touching; real lenses have thickness and a gap between them","The formula only works for mirrors","The screen was too bright","Focal length changes with ISO"],e:"1/fc = 1/f1 + 1/f2 is the thin-lens version. Glass thickness and spacing shift the principal (nodal) planes."},
{id:"LB6",t:"lab2",k:"tf",q:"In a complex (multi-element) lens, the rear nodal point can be outside the lens, even in front of it.",a:true,e:"True. In a telephoto design the rear nodal point sits in front of the lens, which is why the lens is shorter than its focal length."},
{id:"LB7",t:"lab2",k:"mc",q:"For a simple thin lens in air, the front and rear nodal points are…",o:["At the same place, in the center of the lens","Far apart, outside the lens","At the two glass surfaces","At the focal points"],e:"Thin lens: both nodal points merge at the optical center. Thick and complex lenses split them apart."},
{id:"LB8",t:"lab2",k:"num",q:"A +4 diopter close-up lens is put on a lens focused at infinity. How far away (mm) must the subject be to be sharp?",a:250,tol:0.5,d:"250 mm",e:"Subject distance = 1/D = 1/4 m = 250 mm (the close-up lens's focal length)."},
{id:"LB9",t:"lab2",k:"num",q:"You photograph a ruler with a full-frame camera, and 96 mm of the ruler fills the frame's 24 mm short side. What is the scale of reproduction R? (2 decimals)",a:0.25,tol:0.005,d:"0.25 (1:4)",e:"R = 24 ÷ 96 = 0.25 = 1:4."},
{id:"LB10",t:"lab2",k:"tf",q:"From the same camera position, a longer focal length gives a larger scale of reproduction.",a:true,e:"True. More magnification means more of the sensor is filled by a smaller part of the scene."},
{id:"LB11",t:"lab2",k:"mc",q:"A 35 mm lens on a 1.6× crop camera. What is the slowest handheld shutter speed (handheld rule)?",o:["1/60","1/30","1/35","1/125"],e:"35 × 1.6 = 56, so 1/56, rounded to the next faster whole stop = 1/60."},
{id:"LB12",t:"lab2",k:"mc",q:"The handheld shutter rule says your slowest safe speed is 1/250. Your lens has 3 stops of image stabilization. The slowest safe speed is about…",o:["1/30","1/125","1/2000","1/250"],e:"Each stop halves it: 1/250 → 1/125 → 1/60 → 1/30."},
{id:"LB13",t:"lab2",k:"mc",q:"On a tripod you should usually set image stabilization to…",o:["Off","On, maximum","Panning mode always","It doesn't matter"],e:"On a tripod the IS system can search for movement and actually add blur."},
{id:"LB14",t:"lab2",k:"mc",q:"Which holding technique gives the steadiest handheld shot?",o:["Elbows tucked to your body, left hand under the lens, exhale and press gently","Arms stretched out, looking at the rear screen","One hand on the grip only","Jab the shutter button quickly"],e:"Brace the camera against your body, support the lens from below, breathe out and squeeze the release."},
{id:"LB15",t:"lab2",k:"fill",q:"The point a ray aims at in front of the lens and seems to leave from behind it, still parallel to its original direction, is called a ________ point.",a:["nodal"],e:"Nodal point: rays toward the front nodal point leave from the rear nodal point at the same angle."},
{id:"LB16",t:"lab2",k:"num",q:"What is the power (diopters) of a lens with a 250 mm focal length?",a:4,tol:0,d:"+4 D",e:"D = 1/f(m) = 1/0.25 = 4."},
{id:"SI1",t:"si",k:"mc",q:"Base exposure f/8, 1/250, ISO 400. For N−3, you set 1/125 and ISO 200. What aperture?",o:["f/22","f/11","f/16","f/5.6"],e:"Shutter +1, ISO −1 = 0. You need −3 from the aperture: f/8 → 11 → 16 → 22."},
{id:"SI2",t:"si",k:"mc",q:"Base exposure f/5.6, 1/60, ISO 100. For N+2, you set f/5.6 and 1/250. What ISO?",o:["ISO 1600","ISO 400","ISO 800","ISO 100"],e:"Shutter −2, so ISO must give +4 to reach +2: 100 → 200 → 400 → 800 → 1600."},
{id:"SI3",t:"si",k:"mc",q:"Base exposure f/4, 1/500, ISO 800. For N−2, you set f/2.8 and ISO 100. What shutter speed?",o:["1/500","1/250","1/1000","1/125"],e:"Aperture +1, ISO −3 = −2 already, so the shutter stays the same: 1/500."},
{id:"SI4",t:"si",k:"mc",q:"A histogram has most of its data on the right side, nearly touching the edge. The image is…",o:["High-key and close to clipping the highlights","Low-key and underexposed","Mostly midtones with no clipping","Clipped in the shadows"],e:"Right side = highlights. Touching the right edge = clipped highlights."},
{id:"SI5",t:"si",k:"fill",q:"CMOS stands for Complementary Metal-Oxide ________.",a:["semiconductor"],e:"Complementary Metal-Oxide Semiconductor. Spelling counts!"},
{id:"SI6",t:"si",k:"mc",q:"Blooming is when…",o:["A photosite's charge overflows into its neighbors, making a bright halo or streak","Colors shift toward magenta","A JPEG is saved too many times","The lens flares from the sun"],e:"Too much light overflows the photosite. It's mostly a CCD problem."},
{id:"SI7",t:"si",k:"mc",q:"Which type of noise is the most common?",o:["Photon noise","Thermal noise","Transfer (readout) noise","JPEG noise"],e:"Light itself arrives randomly, so even the input is noisy."},
{id:"SI8",t:"si",k:"mc",q:"Sensor A has an SNR of 12 dB, Sensor B 20 dB. Which is noisier?",o:["Sensor A, because lower SNR means more noise compared with the signal","Sensor B, because the number is bigger","They are the same","You can't tell from SNR"],e:"Higher SNR = cleaner image."},
{id:"SI9",t:"si",k:"num",q:"How many tones are in a 5-bit image?",a:32,tol:0,d:"32",e:"2⁵ = 32."},
{id:"SI10",t:"si",k:"tf",q:"A raw file is always uncompressed.",a:false,e:"False. Her slide says raw does NOT guarantee uncompressed data; compressed and even lossy raw options exist. (The SI key had this wrong.)"},
{id:"SI11",t:"si",k:"tf",q:"Deleting a sidecar (.xmp) file is an example of lossy compression.",a:false,e:"False. A sidecar holds edit instructions; deleting it just loses your edits. (The SI key had this wrong.)"},
{id:"SI12",t:"si",k:"mc",q:"Which statement about vector images is best?",o:["They scale without losing quality; photographs are normally raster, not vector","They can never be used anywhere in photography","They are made of pixels","They have a fixed resolution"],e:"Say \"normally raster\", not \"cannot\"."},
{id:"SI13",t:"si",k:"mc",q:"Which is NOT one of the four compression artifacts?",o:["Pixelation","Blocking","Posterization","Stair-stepping"],e:"BAPS: Blocking, Aliasing, Posterization, Stair-stepping. Pixelation is just magnification."},
{id:"SI14",t:"si",k:"mc",q:"TIFF's maximum file size is…",o:["4 GB","2 MB","64 GB","No limit"],e:"4 GB (BigTIFF goes beyond)."},
{id:"SI15",t:"si",k:"mc",q:"Who created DNG, and when?",o:["Adobe, 2004","Canon, 1999","Apple, 2010","Kodak, 1975"],e:"DNG = Digital Negative, Adobe 2004, based on TIFF 6.0."},
{id:"SI16",t:"si",k:"mc",q:"An ND 0.6 filter blocks how many stops?",o:["2 stops","1 stop","6 stops","0.6 stops"],e:"Each 0.3 of density = 1 stop, so 0.6 = 2 stops."},
{id:"SI17",t:"si",k:"mc",q:"Which is a good use of a neutral density filter?",o:["Blurring moving water in daylight with a long exposure","Making colors more saturated","Fixing a crooked horizon","Raising the ISO"],e:"Also car light trails, hiding moving people and a wide aperture in bright sun."},
{id:"SI18",t:"si",k:"mc",q:"Base exposure 1/250, f/5.6, ISO 200. For N−2, you keep 1/250 and ISO 200. What aperture?",o:["f/11","f/8","f/4","f/16"],e:"Only the aperture changes: −2 stops = f/5.6 → 8 → 11."},
{id:"SI19",t:"si",k:"mc",q:"Base exposure 1/125, f/8, ISO 400. For N+3, you set f/5.6 and ISO 800. What shutter speed?",o:["1/60","1/125","1/30","1/250"],e:"Aperture +1, ISO +1 = +2. You need +3, so the shutter gives +1: 1/125 → 1/60."},
{id:"SI20",t:"si",k:"mc",q:"Base exposure 1/60, f/11, ISO 400. For N−5, you set f/22 and ISO 200. What shutter speed?",o:["1/250","1/15","1/125","1/500"],e:"Aperture −2, ISO −1 = −3. You need −5, so the shutter gives −2: 1/60 → 1/125 → 1/250. (The SI study guide's similar answer of 1/15 is wrong.)"},
{id:"SI21",t:"si",k:"num",q:"In an 8-bit image, what pixel value is pure white?",a:255,tol:0,d:"255",e:"0 = black, 255 = white."},
{id:"SI22",t:"si",k:"mc",q:"What is clipping on a histogram?",o:["Data piled against the left or right edge: pure black or pure white with no detail","A gap in the middle of the histogram","Too many midtones","Noise in the shadows"],e:"Clipped highlights touch the right edge, clipped shadows the left."},
{id:"SI23",t:"si",k:"num",q:"How many bits does an image with 64 tones have?",a:6,tol:0,d:"6 bits",e:"2^x = 64, so x = 6."},
{id:"SI24",t:"si",k:"num",q:"Mean = 12, standard deviation = 3. What is the SNR in dB? (1 decimal)",a:12.0,tol:0.1,d:"12.0 dB",e:"20 × log(12 ÷ 3) = 20 × log(4) = 20 × 0.602 ≈ 12.0 dB. Always finish the log!"},
{id:"SI25",t:"si",k:"num",q:"A sensor's diagonal is 27 mm. What is its crop factor? (2 decimals)",a:1.60,tol:0.01,d:"1.60",e:"43.3 ÷ 27 ≈ 1.60."},
{id:"SI26",t:"si",k:"num",q:"Object distance 240 mm, image distance 80 mm. What is the focal length (mm)?",a:60,tol:0.5,d:"60 mm",e:"1/240 + 1/80 = 0.01667 → press 1/x → 60 mm."},
{id:"SI27",t:"si",k:"num",q:"Two lenses of 30 mm and 60 mm are combined. Combined focal length (mm)?",a:20,tol:0.5,d:"20 mm",e:"1/30 + 1/60 = 0.05 → 1/x → 20 mm."},
{id:"SI28",t:"si",k:"num",q:"f = 50 mm and m = 2. What is the image distance v (mm)?",a:150,tol:0.5,d:"150 mm",e:"v = f(m + 1) = 50 × 3 = 150 mm. Then u = v ÷ m = 75 mm."},
{id:"SI29",t:"si",k:"num",q:"A lens has a focal length of 25 mm. What is its power in diopters?",a:40,tol:0.5,d:"40 diopters",e:"Convert to METERS first: 25 mm = 0.025 m. D = 1 ÷ 0.025 = 40. (The SI key wrote 1/50 = 0.02 for a 50 mm lens, which forgets meters: it's 20 D.)"},
{id:"SI30",t:"si",k:"num",q:"What is the focal length in mm of a +0.5 diopter lens?",a:2000,tol:1,d:"2000 mm",e:"f = 1 ÷ 0.5 = 2 m = 2000 mm. (The SI key turned 1/0.05 into 20 mm; it's 20 m.)"},
{id:"SI31",t:"si",k:"num",q:"A focal length of 40 m. How many diopters? (3 decimals)",a:0.025,tol:0.001,d:"0.025 D",e:"D = 1 ÷ 40 = 0.025 (it's already in meters)."},
{id:"SI32",t:"si",k:"mc",q:"How does the professor say ISO stands for?",o:["International Standards Organization","International Sensor Output","Image Sensitivity Option","Internal Signal Offset"],e:"Her slide/lecture wording. (The official name is the International Organization for Standardization.)"},
{id:"SI33",t:"si",k:"tf",q:"At night you should always shoot with the aperture wide open.",a:false,e:"False. Choose the aperture that gives the depth of field you want."},
{id:"SI34",t:"si",k:"mc",q:"On a full-frame camera, which is a normal lens?",o:["50 mm","18 mm","200 mm","10 mm"],e:"Short: 18–24 mm. Normal: 50 mm. Long: 150–200 mm."},
{id:"SI35",t:"si",k:"fill",q:"A ________ focal length bends light sharply.",a:["short"],e:"Short focal length = strong bending (wide angle). Long = bends light very little."},
{id:"SI36",t:"si",k:"tf",q:"A DNG file needs a separate sidecar (.xmp) file for its edits.",a:false,e:"False. DNG stores the edits inside the file. (It's ~10–15% smaller because of its compression, not because of the sidecar.)"},
{id:"SI37",t:"si",k:"tf",q:"Compressing an image changes its file size but NOT its resolution.",a:true,e:"True. 600×800 stays 600×800."},
{id:"SI38",t:"si",k:"mc",q:"Which file format is called a \"legacy\" format, and why?",o:["DNG, because Adobe promises it will always be supported","JPEG, because it is the oldest","raw, because every camera makes it","TIFF, because it has layers"],e:"DNG is legacy/versionable: it will still open in the future."},
{id:"SI39",t:"si",k:"mc",q:"Which shutter speed blurs motion?",o:["1/2 second","1/500","1/1000","1/250"],e:"A slow shutter blurs motion."},
{id:"SI40",t:"si",k:"mc",q:"Kodak TrueSense adds which kind of pixels to the color filter array?",o:["Panchromatic (unfiltered) pixels that catch all the light","Extra blue pixels","Infrared pixels","Pixels with no photodiode"],e:"Pan pixels give luminance and about 2/3 more light, better in low light."},
{id:"RV1",rv:"AB2",t:"aber",k:"mc",q:"What is bokeh?",o:["The quality of the blur in out-of-focus areas","The amount of depth of field","Color fringing around edges","A type of lens distortion"],e:"Bokeh is determined by lens aberrations and the aperture."},
{id:"RV2",rv:"AB6",t:"aber",k:"fill",q:"An achromatic doublet corrects ________ aberration.",a:["chromatic"],e:"Crown glass + flint glass cemented together. Spelling counts!"},
{id:"RV3",rv:"AB9",t:"aber",k:"mc",q:"What does barrel distortion look like?",o:["Straight lines bulge outward at the edges","Lines pinch inward","Colors fringe at edges","The center is blurry"],e:"Like a barrel. Magnification decreases away from the axis (fisheye)."},
{id:"RV4",rv:"AB10",t:"aber",k:"fill",q:"Pincushion distortion from eyeglasses comes from ________ lenses.",a:["negative","negative lens","negative lenses","concave"],e:"Negative (concave) lenses, like glasses for nearsighted people."},
{id:"RV5",rv:"AB13",t:"aber",k:"mc",q:"What is the diffraction limit of a lens?",o:["The point where diffraction softening cancels the sharpness gained by stopping down","The widest aperture of the lens","The closest focusing distance","The maximum shutter speed"],e:"Stop down past it and the image gets softer."},
{id:"RV6",rv:"AB15",t:"aber",k:"fill",q:"The largest circle that still appears as a point is the permissible circle of ________.",a:["confusion"],e:"Permissible circle of confusion."},
{id:"RV7",rv:"AB18",t:"aber",k:"fill",q:"The closest distance that appears sharp when the lens is focused at infinity is the ________ distance.",a:["hyperfocal"],e:"Hyperfocal distance. Spelling counts!"},
{id:"RV8",rv:"LB15",t:"lab2",k:"mc",q:"What is a nodal point?",o:["The point a ray aims at entering the lens and seems to leave from, still parallel to its original direction","The point where all colors focus","The center of the aperture blades","The front glass surface"],e:"Swing a lens around its rear nodal point and the image doesn't move."},
{id:"RV9",rv:"SI5",t:"si",k:"fill",q:"Which sensor type is a Complementary Metal-Oxide Semiconductor? (abbreviation)",a:["cmos"],e:"CMOS."},
{id:"RV10",rv:"D7",t:"dsens",k:"fill",q:"Which sensor type is a Charge-Coupled Device? (abbreviation)",a:["ccd"],e:"CCD."},
{id:"RV11",rv:"SI6",t:"si",k:"fill",q:"A photosite's charge overflowing into its neighbors, making a bright halo or streak, is called ________.",a:["blooming"],e:"Blooming, mostly a CCD problem."},
{id:"RV12",rv:"C2",t:"cfa",k:"mc",q:"What does demosaicing do?",o:["Fills in the two missing colors at every pixel from its neighbors","Removes noise","Compresses the raw file","Converts RGB to YCbCr"],e:"It rebuilds full color from the Bayer (CFA) data."},
{id:"RV13",rv:"C9",t:"cfa",k:"mc",q:"What is photon noise?",o:["Random variation in the light itself: the most common noise","Heat from the electronics read as light","Charge left behind during readout","Banding from too few bits"],e:"Light arrives randomly, so even the input is noisy."},
{id:"RV14",rv:"C10",t:"cfa",k:"fill",q:"Noise from the camera's heat that photosites read as if it were light is ________ noise.",a:["thermal"],e:"Thermal noise. Cooled sensors reduce it."},
{id:"RV15",rv:"C11",t:"cfa",k:"mc",q:"What is transfer (readout) noise?",o:["Charge not fully transferred during readout, or neighboring photosites interfering","Random variation in the light","Heat read as light","JPEG compression"],e:"Also called transfer process noise."},
{id:"RV16",rv:"F1",t:"fmt",k:"fill",q:"Tagged Image File Format is abbreviated ____.",a:["tiff","tif"],e:"TIFF."},
{id:"RV17",rv:"F3",t:"fmt",k:"fill",q:"Joint Photographic Experts Group is abbreviated ____.",a:["jpeg","jpg"],e:"JPEG."},
{id:"RV18",rv:"N8",t:"snr",k:"fill",q:"In the histogram panel, the Std Dev (standard deviation) value represents the ________.",a:["noise","amount of noise","the noise"],e:"Std Dev = noise; Mean = signal. SNR = 20 × log(mean ÷ std dev)."},
{id:"RV19",rv:"P1",t:"comp",k:"fill",q:"Compression where decompressing gives back the exact original is called ________.",a:["lossless"],e:"Lossless. Lossy throws data away for good."},
{id:"RV20",rv:"P7",t:"comp",k:"mc",q:"What is blocking?",o:["Visible 8 × 8 squares from aggressive JPEG compression","Smooth tones turning into steps","Jagged diagonal edges","Seeing pixels when you zoom in"],e:"One of BAPS: Blocking, Aliasing, Posterization, Stair-stepping."},
{id:"RV21",rv:"P8",t:"comp",k:"mc",q:"What is posterization?",o:["Smooth tones turning into visible steps (banding) from too few tonal levels","Visible 8 × 8 squares","Jagged diagonal edges","Moiré patterns"],e:"Also called banding."},
{id:"RV22",rv:"P10",t:"comp",k:"mc",q:"What is stair-stepping?",o:["Jagged steps along diagonal or curved edges","Visible 8 × 8 squares","Banding in smooth tones","Seeing pixels when zoomed in"],e:"Don't call it \"jaggies\" on the exam."},
{id:"RV23",rv:"L1",t:"lens",k:"fill",q:"In RATS, what does the A stand for?",a:["absorbed","absorption"],e:"Reflected, Absorbed, Transmitted, Scattered."},
{id:"RV24",rv:"L3",t:"lens",k:"mc",q:"What is scattered light?",o:["Light redirected in many directions by dust or water, like fog with headlights","Light that bounces off at the same angle","Light that turns into heat","Light that passes straight through"],e:"Scattered light acts like flare and forms no image."},
{id:"RV25",rv:"L4",t:"lens",k:"fill",q:"A lens that is thicker in the center and converges light is a ________ lens.",a:["positive","convex","positive convex"],e:"Positive (convex). It forms a real image by itself."},
{id:"RV26",rv:"L7",t:"lens",k:"fill",q:"In lens equations, the object distance is written with which letter?",a:["u"],e:"u = object distance, v = image distance."},
{id:"RV27",rv:"L11",t:"lens",k:"fill",q:"The bending of light as it passes from one medium into another is called ________.",a:["refraction"],e:"Refraction. Spelling counts!"},
{id:"RV28",rv:"R10",t:"raw",k:"fill",q:"Which file type, saved next to a raw file, stores your edit instructions? (extension)",a:["xmp",".xmp","xmp sidecar","sidecar","sidecar file"],e:"The .xmp sidecar. Keep it with the raw."},
{id:"RV29",rv:"R12",t:"raw",k:"fill",q:"Adobe promises DNG files will still open in the future, so DNG is called a ________ format.",a:["legacy","legacy and versionable"],e:"Legacy / versionable."},
{id:"RV30",rv:"R15",t:"raw",k:"mc",q:"What is a vector image?",o:["Shapes defined mathematically, so it scales without losing quality","A grid of pixels","A raw sensor file","A compressed JPEG"],e:"Logos, diagrams, type. Photos are normally raster."},
{id:"RV31",rv:"LT8",t:"lens2",k:"fill",q:"A lens with the negative element in front, so its rear nodal point falls behind the lens, is called a ________ lens.",a:["retrofocus","reverse telephoto","retro focus","reverse-telephoto"],e:"Retrofocus = reverse telephoto. That's how DSLR wide angles clear the mirror."},
{id:"RV32",rv:"LT11",t:"lens2",k:"fill",q:"A lens that reaches at least 1:1 is a true ________ lens.",a:["macro"],e:"Macro."},
{id:"RV33",rv:"LT16",t:"lens2",k:"fill",q:"Which kind of lens keeps building verticals from converging?",a:["tilt-shift","tilt shift","tiltshift","perspective control","perspective-control","shift"],e:"Tilt-shift (perspective control) lens."},
{id:"RV34",rv:"LT17",t:"lens2",k:"fill",q:"A lens that folds the light path with curved mirrors is called a ________ lens.",a:["catadioptric","mirror"],e:"Catadioptric (mirror) lens. Usually one fixed f-stop."},
{id:"RV35",rv:"LT15",t:"lens2",k:"mc",q:"A diopter is 1 divided by…",o:["The focal length in meters","The focal length in millimeters","The aperture diameter","The f-number"],e:"D = 1 ÷ f (meters)."},
{id:"RV36",rv:"SC8",t:"scale",k:"fill",q:"Moving the camera closer or farther changes the ________.",a:["perspective"],e:"Camera position = perspective. Focal length = framing."},
{id:"RV37",rv:"C7",t:"cfa",k:"fill",q:"Which sensor records red, green and blue at every pixel using how deep each color goes into the silicon?",a:["foveon","foveon x3","x3"],e:"Foveon X3, the direct image sensor."},
{id:"RV38",rv:"S3",t:"sensor",k:"fill",q:"Which sensor size has a crop factor of 1?",a:["full frame","full-frame","fullframe","35mm","35 mm"],e:"Full frame (24 × 36 mm)."},
{id:"RV39",rv:"SI16",t:"si",k:"num",q:"What density of ND filter blocks exactly 1 stop?",a:0.3,tol:0,d:"ND 0.3",e:"Every 0.3 of density = 1 stop."},
{id:"LT1",t:"lens2",k:"mc",q:"A \"normal\" lens reproduces a field of view of about…",o:["47° (like human vision)","94°","8°","180°"],e:"Normal ≈ 47° on the diagonal, which looks natural to a human observer."},
{id:"LT2",t:"lens2",k:"mc",q:"The normal focal length for a 4×5 camera is about…",o:["150 mm","50 mm","24 mm","300 mm"],e:"Normal ≈ the format's diagonal: ~50 mm for 35 mm/full frame and ~150 mm for 4×5."},
{id:"LT3",t:"lens2",k:"num",q:"A Four Thirds sensor is 17.3 × 13 mm (diagonal ≈ 21.6 mm). What is its crop factor? (1 decimal)",a:2.0,tol:0.05,d:"2.0",e:"43.3 ÷ 21.6 ≈ 2.0"},
{id:"LT4",t:"lens2",k:"num",q:"A full-frame 50 mm lens on a 2× crop camera acts like what focal length (mm)?",a:100,tol:0.5,d:"100 mm",e:"50 × 2 = 100 mm equivalent."},
{id:"LT5",t:"lens2",k:"mc",q:"Which lens/camera combination will NOT cover the sensor?",o:["A crop (APS-C) lens on a full-frame camera","A full-frame lens on an APS-C camera","A full-frame lens on a full-frame camera","An APS-C lens on an APS-C camera"],e:"The crop lens's image circle is too small. That's why upgrading to full frame means rebuying lenses."},
{id:"LT6",t:"lens2",k:"mc",q:"Compared with a normal lens, a telephoto lens has…",o:["More magnification, a narrower field of view and less depth of field","Less magnification and a wider field of view","More depth of field","Barrel distortion"],e:"Telephoto = longer than normal. Great for portraits and distant subjects."},
{id:"LT7",t:"lens2",k:"mc",q:"Compared with a normal lens, a wide-angle lens has…",o:["Less magnification, a wider field of view and more depth of field","More magnification and a narrower view","Less depth of field","No distortion ever"],e:"Wide angle can show perspective and barrel distortion. An extreme wide angle is a fisheye."},
{id:"LT8",t:"lens2",k:"mc",q:"In a reverse telephoto (retrofocus) design…",o:["The negative element is in front and the back nodal point falls behind the lens, so it clears the mirror","The positive element is in front and the back nodal point falls in front of the lens","There are no negative elements","Mirrors fold the light path"],e:"Her slide: \"Reverse Telephoto Wide Angle Lens\". Swapping the elements moves the lens away from the mirror."},
{id:"LT9",t:"lens2",k:"mc",q:"\"Changing focal length changes ______; moving the camera changes ______.\"",o:["framing; perspective","perspective; framing","exposure; focus","depth of field; color"],e:"Camera position controls perspective."},
{id:"LT10",t:"lens2",k:"mc",q:"Which is TRUE of a zoom lens compared with a prime?",o:["It may be slower (smaller max aperture), less corrected and less sharp, but it frames flexibly","It always has a larger max aperture","It has one fixed focal length","It never has aberrations"],e:"Primes are fixed and usually fast. Zooms are flexible but more complex."},
{id:"LT11",t:"lens2",k:"mc",q:"A TRUE macro lens must reach at least…",o:["1:1","1:2","1:4","10:1"],e:"1:1 = life size. A 15 mm ladybug is 15 mm on the sensor."},
{id:"LT12",t:"lens2",k:"num",q:"At 1:2, a 20 mm object is how many mm on the sensor?",a:10,tol:0,d:"10 mm",e:"1:2 = half life size."},
{id:"LT13",t:"lens2",k:"num",q:"What is the focal length (mm) of a +2 diopter supplemental lens?",a:500,tol:0.5,d:"500 mm",e:"f = 1/D = 1/2 m = 0.5 m = 500 mm."},
{id:"LT14",t:"lens2",k:"num",q:"You stack a +1 and a +3 diopter lens. What is the combined power in diopters?",a:4,tol:0,d:"4 diopters",e:"Diopters are additive: 1 + 3 = 4 (f = 250 mm)."},
{id:"LT15",t:"lens2",k:"mc",q:"Diopters are defined using focal length in…",o:["Meters","Millimeters","Inches","Feet"],e:"D = 1/f with f in meters."},
{id:"LT16",t:"lens2",k:"mc",q:"A tilt-shift (perspective control) lens is mainly used to…",o:["Prevent converging lines, e.g. in architecture","Add soft focus","Fold the optics with mirrors","Increase ISO"],e:"Shifting keeps verticals straight, like a 4×5 camera's movements."},
{id:"LT17",t:"lens2",k:"mc",q:"A main drawback of a catadioptric (mirror) lens is…",o:["Usually one fixed f-stop, so no depth-of-field control","It's very heavy and long","It can't focus","It has no glass"],e:"The mirrors give a long focal length in a short lens, but the aperture is fixed and metering can be off."},
{id:"LT18",t:"lens2",k:"mc",q:"A soft-focus lens works by…",o:["Under-correcting spherical aberration (soft edges, sharp center)","Defocusing the whole image","Adding a diffusion filter to the sensor","Using a mirror"],e:"The effect is reduced as the lens is stopped down. Defocus is just blur."},

{id:"D1",t:"dsens",k:"mc",q:"On the sensor it's called a ______; in the image file it's called a pixel.",o:["Photosite","Byte","Microlens","Voxel"],e:"Photosite (photodiode) on the sensor → pixel in the file."},
{id:"D2",t:"dsens",k:"tf",q:"A photodiode can tell the difference between red, green and blue light.",a:false,e:"False. Photosites are colorblind: they only measure brightness. Color comes from the color filter array."},
{id:"D3",t:"dsens",k:"mc",q:"The voltage a photosite produces is an ______ signal, and the ______ turns it into digital counts.",o:["analog, A/D converter","digital, microlens","analog, Bayer filter","digital, shift register"],e:"Voltage is analog (unlimited levels). The analog-to-digital converter turns it into digital counts, limited by bit depth."},
{id:"D4",t:"dsens",k:"num",q:"How many tones can a 3-bit image show?",a:8,tol:0,d:"8",e:"2³ = 8 tones."},
{id:"D5",t:"dsens",k:"mc",q:"A 24-bit color image can show about…",o:["16.7 million colors","256 colors","65,536 colors","4,096 colors"],e:"8 bits × 3 channels = 24 bits → 2²⁴ ≈ 16.7 million."},
{id:"D6",t:"dsens",k:"mc",q:"Low bit depth (banding) is MOST visible in…",o:["Smooth, low-frequency areas like a plain wall or sky","Busy, high-frequency areas like grass or hair","Only the highlights","Only in raw files"],e:"High-frequency detail hides the steps; flat areas show them."},
{id:"D7",t:"dsens",k:"fill",q:"CCD stands for charge-coupled ________.",a:["device"],e:"CCD = Charge-Coupled Device."},
{id:"D8",t:"dsens",k:"mc",q:"CMOS stands for…",o:["Complementary Metal-Oxide Semiconductor","Charge Metal Output Sensor","Color Mosaic Optical Sensor","Complementary Micro-Optical Sensor"],e:"Complementary Metal-Oxide Semiconductor."},
{id:"D9",t:"dsens",k:"mc",q:"How does a CCD read out its data?",o:["A shift register moves each row down and reads it one pixel at a time (slow)","Every photosite has its own A/D converter (instant)","It reads all colors in three layers","It uses microlenses"],e:"Like a conveyor belt: slow, high power, limits burst shooting."},
{id:"D10",t:"dsens",k:"mc",q:"Why do CMOS sensors need microlenses over each photosite?",o:["The circuitry at each photosite takes up space, so lenses funnel light into the smaller light-sensitive area","To filter colors","To cool the sensor","To blur edges"],e:"The A/D circuitry shrinks the light-catching area; microlenses compensate."},
{id:"D11",t:"dsens",k:"mc",q:"Approximate quantum efficiency of a CCD?",o:["~90%","~15%","~5%","~50%"],e:"CCD ≈ 90%, human eye ≈ 15%, film ≈ 5%. That's why astronomers love CCDs."},
{id:"D12",t:"dsens",k:"mc",q:"Which statement about CMOS vs CCD is TRUE?",o:["CMOS uses much less power (up to 100× less) and costs less to produce","CCD uses less power","CMOS was invented after CCD","CMOS can't work in cold temperatures"],e:"CMOS (1963) predates CCD (1969), uses less power, costs less, and works from −55 °C to +125 °C."},
{id:"D13",t:"dsens",k:"mc",q:"Who invented the CCD?",o:["Willard Boyle and George Smith, AT&T Bell Labs, 1969","Bryce Bayer, Kodak, 1976","Frank Wanlass, Fairchild, 1963","Sigma, 2008"],e:"Boyle and Smith shared the 2009 Nobel Prize in Physics."},
{id:"D14",t:"dsens",k:"mc",q:"The Bayer pattern was invented by…",o:["Bryce Bayer at Kodak (1976)","Bryce Bayer at Fujifilm (1990)","Willard Boyle at Bell Labs","Adobe (2004)"],e:"Kodak, 1976. It later won an Emmy (2001)."},
{id:"D15",t:"dsens",k:"tf",q:"The camera's in-camera histogram is based on the JPEG, even if you shoot raw.",a:true,e:"True, so a raw file may hold more highlight detail than the histogram suggests."},
{id:"D16",t:"dsens",k:"mc",q:"CCDs are naturally sensitive to infrared light, so most have…",o:["An IR-blocking filter","A Bayer filter only","No filter at all","A UV filter only"],e:"Removing it allows infrared photography (sent to professionals, never DIY)."},
{id:"R16",t:"raw",k:"mc",q:"Which RAW extension belongs to Nikon?",o:["NEF","CR3","ARW","RAF"],e:"Canon CR2/CR3, Nikon NEF/NRW, Sony ARW, Fujifilm RAF, Olympus ORF, Panasonic RW2, Pentax PEF."},
{id:"R17",t:"raw",k:"mc",q:"Since which software version could you save a lossy DNG?",o:["Lightroom 4","Photoshop 7","Lightroom Classic 13","It's never possible"],e:"Lossy DNG has been possible since Lightroom 4."},
{id:"F16",t:"fmt",k:"mc",q:"What file extension does JPEG XL use?",o:[".jxl",".jpx",".jpgxl",".jp2"],e:"JPEG XL = .jxl (ISO/IEC 18181)."},
{id:"F17",t:"fmt",k:"mc",q:"Typical size range of a JPEG file, according to the lecture slide?",o:["500 KB – 8 MB","5 KB – 50 KB","50 MB – 200 MB","1 GB – 4 GB"],e:"Small files: about 500 KB to 8 MB."},

{id:"C1",t:"cfa",k:"mc",q:"In a Bayer color filter array, what share of the photosites are green?",o:["50%","25%","33%","75%"],e:"50% green, 25% red, 25% blue: we're most sensitive to green."},
{id:"C2",t:"cfa",k:"fill",q:"The processing that fills in the two missing colors at every Bayer pixel is called ________.",a:["demosaicing","demosaicking","de-mosaicing","demosaic"],e:"Demosaicing rebuilds full RGB from the color filter array data. Spelling counts!"},
{id:"C3",t:"cfa",k:"mc",q:"In a standard demosaicing algorithm, which channel is used first to build the luminance image?",o:["Green","Red","Blue","All equally"],e:"Green has the most data and matches our brightness sensitivity."},
{id:"C4",t:"cfa",k:"mc",q:"Which channel usually has the MOST noise after processing?",o:["Blue","Green","Red","Luminance"],e:"Blue needs the biggest boost, so its noise is amplified the most."},
{id:"C5",t:"cfa",k:"mc",q:"Kodak's TrueSense CFA improves low-light performance by…",o:["Using panchromatic (unfiltered) pixels that catch all the light","Adding more blue pixels","Stacking three color layers","Cooling the sensor"],e:"A color filter throws away about 2/3 of the light. Pan pixels keep it all."},
{id:"C6",t:"cfa",k:"mc",q:"Which company created the X-Trans color filter array, which has more green?",o:["Fujifilm","Kodak","Sigma","Canon"],e:"X-Trans = Fujifilm."},
{id:"C7",t:"cfa",k:"mc",q:"The Foveon X3 is called a direct image sensor because it…",o:["Records red, green and blue at every photosite using penetration depth, with no color filters","Uses a Bayer filter with panchromatic pixels","Has no demosaicing because it is monochrome","Records only luminance"],e:"Blue is absorbed shallow, green middle, red deepest, so there's no CFA."},
{id:"C8",t:"cfa",k:"mc",q:"The biggest complaint about Foveon sensors is…",o:["Blur on moving subjects (and odd colors)","Too much green","They need demosaicing","They are too cheap"],e:"Great for still life, weak for motion. Sigma bought Foveon in 2008."},
{id:"C9",t:"cfa",k:"mc",q:"Which noise type is the MOST common in a photographic image?",o:["Photon noise","Thermal noise","Transfer noise","Grain"],e:"Light itself arrives randomly, so even the input is noisy."},
{id:"C10",t:"cfa",k:"mc",q:"Heat from the camera's electronics that the photosite reads as photons is…",o:["Thermal noise","Photon noise","Transfer noise","Aliasing"],e:"Fix: cooled sensors."},
{id:"C11",t:"cfa",k:"mc",q:"Charge left behind during readout, or neighboring photosites interfering, is…",o:["Transfer noise","Thermal noise","Photon noise","Posterization"],e:"Like syrup left in the can: transfer noise."},
{id:"C12",t:"cfa",k:"tf",q:"In a digital camera, the correct term is noise, not grain.",a:true,e:"True. Grain = film's silver halide crystals. Noise = electronic."},
{id:"C13",t:"cfa",k:"mc",q:"Expose to the right (ETTR) works best for…",o:["A low-key scene without bright highlights, shot in raw","A bride in white next to a groom in black","Any JPEG","A sunny sky with white clouds"],e:"It moves shadows up, away from the noise, but only if nothing clips. Raw only."},
{id:"C14",t:"cfa",k:"mc",q:"HDR is the right tool when…",o:["The scene's range is too big for one exposure, e.g. a room plus a bright window view","The scene is low-key","You want less noise in one shot","You shoot handheld at night with one frame"],e:"HDR = several exposures on a sturdy tripod, merged in software."},
{id:"C15",t:"cfa",k:"tf",q:"Raising the ISO makes the photodiode itself more sensitive to light.",a:false,e:"False. Its sensitivity is fixed. ISO just adds gain (amplification)."},
{id:"R1",t:"raw",k:"num",q:"How many bits are in one byte?",a:8,tol:0,d:"8",e:"Byte = 8 bits."},
{id:"R2",t:"raw",k:"mc",q:"In the BINARY system, 1 kilobyte equals…",o:["1,024 bytes","1,000 bytes","8 bits","100 bytes"],e:"Decimal says 1,000. Binary (what operating systems use) says 1,024."},
{id:"R3",t:"raw",k:"mc",q:"Compared with a JPEG, an unprocessed RAW has…",o:["Higher dynamic range, lower contrast, and is less sharp","Lower dynamic range, higher contrast","Higher contrast and more sharpness","The same tone and sharpness"],e:"A favorite test question: RAW = more range, less contrast, less sharp, not ready for output."},
{id:"R4",t:"raw",k:"mc",q:"Why is a RAW file less sharp before processing?",o:["The anti-aliasing filter blurs it, and sharpening hasn't been applied yet","RAW files are lower resolution","The Bayer filter removes detail permanently","Noise reduction is always on"],e:"The anti-aliasing filter is a blur filter. Processing sharpens afterward."},
{id:"R5",t:"raw",k:"mc",q:"Which file is bigger: the RAW mosaic or the demosaiced image?",o:["The demosaiced image: 3 channels instead of 1","The RAW: it has more bits","They are the same","It depends on the ISO"],e:"RAW has one gray value per photosite. Demosaiced has R, G and B at every pixel."},
{id:"R6",t:"raw",k:"fill",q:"An 8-bit JPEG channel can hold values from 0 to ____.",a:["255"],e:"2⁸ = 256 levels: 0 to 255."},
{id:"R7",t:"raw",k:"num",q:"How many gray levels does a 12-bit raw have?",a:4096,tol:0,d:"4,096",e:"2¹² = 4,096."},
{id:"R8",t:"raw",k:"tf",q:"Bit depth and dynamic range mean the same thing.",a:false,e:"False. Bit depth = number of levels. Dynamic range = range between the smallest and largest USEFUL values."},
{id:"R9",t:"raw",k:"mc",q:"Which camera setting does NOT change the RAW sensor data?",o:["Picture style / saturation / sharpening","Aperture","Shutter speed","ISO"],e:"Those are rendered at output: they affect the JPEG and preview only. White balance is just metadata."},
{id:"R10",t:"raw",k:"mc",q:"What is stored in the .xmp sidecar file?",o:["Metadata and your edit instructions","The RAW pixel data","A JPEG preview only","The camera firmware"],e:"Delete it and your Camera Raw edits are gone. Keep it with the RAW."},
{id:"R11",t:"raw",k:"mc",q:"DNG was introduced by Adobe in…",o:["2004","1986","1994","2015"],e:"2004, based on TIFF, publicly documented."},
{id:"R12",t:"raw",k:"mc",q:"What does it mean that DNG is \"legacy and versionable\"?",o:["Adobe guarantees older DNGs will still open in future software","It can only be opened in old software","It is uncompressed forever","Every camera must use it"],e:"That archival promise is DNG's big advantage over proprietary raw formats."},
{id:"R13",t:"raw",k:"tf",q:"A RAW file is guaranteed to be uncompressed.",a:false,e:"False. Many cameras offer compressed raw, sometimes even lossy. Check your settings."},
{id:"R14",t:"raw",k:"mc",q:"Which of these is a CAPTURED (not rendered) image format?",o:["DNG","TIFF","JPEG","PNG"],e:"Captured = RAW and DNG. Everything else is rendered."},
{id:"R15",t:"raw",k:"mc",q:"Which image type stores shapes as math and scales without losing quality?",o:["Vector (e.g. EPS)","Raster (e.g. TIFF)","RAW","JPEG"],e:"Vector: logos, diagrams, graphs, type. Photos are raster."},
{id:"F1",t:"fmt",k:"mc",q:"What does TIFF stand for?",o:["Tagged Image File Format","Tagged Interchange File Format","True Image File Format","Tiled Image File Format"],e:"Tagged Image File Format: Aldus 1986, Adobe since 1994."},
{id:"F2",t:"fmt",k:"mc",q:"What is the maximum size of a classic TIFF (32-bit offsets)?",o:["4 GB","2 GB","16 GB","No limit"],e:"BigTIFF uses 64-bit offsets for bigger files."},
{id:"F3",t:"fmt",k:"mc",q:"What does JPEG stand for?",o:["Joint Photographic Experts Group","Joint Picture Encoding Group","Just Photographic Encoding Graphics","Joint Photo Exchange Grid"],e:"It's both a file format and a lossy compression method."},
{id:"F4",t:"fmt",k:"mc",q:"Re-saving the same JPEG again and again causes…",o:["Generational degradation","Lossless recompression","Higher bit depth","Larger resolution"],e:"Each save compresses an already compressed file. Edit in TIFF or PSD instead."},
{id:"F5",t:"fmt",k:"num",q:"How many bits per channel can a JPEG store?",a:8,tol:0,d:"8",e:"JPEG is 8 bits per channel only."},
{id:"F6",t:"fmt",k:"mc",q:"Which is TRUE about TIFF vs JPEG?",o:["TIFF supports transparency and repeated editing better","JPEG supports transparency","JPEG supports 16-bit","TIFF is always lossy"],e:"TIFF: lossless or lossy, 8/16/32 bits, layers, alpha. JPEG: lossy, 8-bit, no transparency."},
{id:"F7",t:"fmt",k:"mc",q:"Which format uses indexed color with a maximum of 256 colors?",o:["GIF","PNG","HEIF","JPEG XL"],e:"GIF: 256-color palette, LZW, animation, transparency."},
{id:"F8",t:"fmt",k:"mc",q:"Best format for a screenshot or diagram with sharp text and transparency?",o:["PNG","JPEG","GIF","BMP"],e:"PNG is lossless with alpha transparency and handles sharp edges well."},
{id:"F9",t:"fmt",k:"mc",q:"HEIF was developed by…",o:["MPEG (Moving Picture Experts Group)","Adobe","Google","Kodak"],e:"High Efficiency Image File Format, finalized 2015. It's a container."},
{id:"F10",t:"fmt",k:"mc",q:"What is the relationship between HEIF and HEIC?",o:["HEIF is the container; HEIC is a HEIF file holding HEVC-encoded images","They are unrelated","HEIC is the container; HEIF is the codec","HEIC is a RAW format"],e:"Related but not the same."},
{id:"F11",t:"fmt",k:"mc",q:"Which format can losslessly recompress existing JPEGs?",o:["JPEG XL","GIF","BMP","TIFF"],e:"JPEG XL also does lossy or lossless, HDR, high bit depth, animation and alpha."},
{id:"F12",t:"fmt",k:"mc",q:"Who developed WebP?",o:["Google","Adobe","Apple","MPEG"],e:"A modern raster web format, lossy or lossless."},
{id:"F13",t:"fmt",k:"mc",q:"Archival preservation = redundancy + documentation + validation + …",o:["a migration plan","DNG conversion","JPEG copies","a bigger card"],e:"Format alone isn't enough."},
{id:"F14",t:"fmt",k:"mc",q:"In raw processing, what does tone mapping do?",o:["Applies a curve because the sensor is linear and human vision isn't","Demosaics the image","Compresses the file","Removes dead pixels"],e:"Tone mapping is like a gamma curve."},
{id:"F15",t:"fmt",k:"tf",q:"In a raw file, the white balance is baked in and can't be changed without loss.",a:false,e:"False. It's read from metadata. Change it freely in Camera Raw."},
{id:"P1",t:"comp",k:"mc",q:"Lossless compression means…",o:["Decompressing gives back the exact original data","Some data is thrown away","Resolution is reduced","Colors are limited to 256"],e:"Lossy gives back only an approximation."},
{id:"P2",t:"comp",k:"mc",q:"Storing \"red ×4, blue ×7, green ×2\" instead of 13 separate pixels uses…",o:["Statistical redundancy","Psychovisual redundancy","Aliasing","Chroma subsampling"],e:"Frequent patterns can be stored very efficiently."},
{id:"P3",t:"comp",k:"mc",q:"Storing 100, +1, 0, +2 instead of 100, 101, 100, 102 uses…",o:["Interpixel (spatial) redundancy","Statistical redundancy","Psychovisual redundancy","Quantization only"],e:"Neighboring pixels are similar, so encode differences."},
{id:"P4",t:"comp",k:"mc",q:"JPEG first converts RGB into…",o:["YCbCr (brightness + two color channels)","CMYK","CIELAB","Grayscale"],e:"Then the color channels are subsampled, because we see brightness better than color."},
{id:"P5",t:"comp",k:"num",q:"JPEG divides the image into blocks of how many pixels per side?",a:8,tol:0,d:"8 (8 × 8 blocks)",e:"8 × 8 blocks are compressed one at a time."},
{id:"P6",t:"comp",k:"tf",q:"Compressing a JPEG lowers its resolution.",a:false,e:"False. Resolution stays the same (600 × 800 stays 600 × 800). File size changes."},
{id:"P7",t:"comp",k:"mc",q:"Visible 8 × 8 squares from aggressive compression are called…",o:["Blocking","Pixelation","Aliasing","Ringing"],e:"Blocking."},
{id:"P8",t:"comp",k:"mc",q:"Smooth tones turning into visible steps because of too few tonal levels is…",o:["Posterization (banding)","Blocking","Aliasing","Moiré"],e:"In class: posterization is a JPEG artifact."},
{id:"P9",t:"comp",k:"mc",q:"Aliasing is fundamentally a…",o:["Sampling problem","Compression-only problem","Noise problem","White balance problem"],e:"Under-sampled detail causes moiré, false detail and color artifacts, and not only in JPEG."},
{id:"P10",t:"comp",k:"mc",q:"The professional word for jagged diagonal edges is…",o:["Stair-stepping","Jaggies","Pixel creep","Blocking"],e:"Saying \"jaggies\" sounds amateur."},
{id:"P11",t:"comp",k:"tf",q:"Zooming to 3200% in Photoshop and seeing squares is a compression artifact.",a:false,e:"False. Pixelation is just magnification."},
{id:"P12",t:"comp",k:"mc",q:"A virtual copy in Lightroom is…",o:["Another set of edit instructions on the same original","A second full-size file","A JPEG export","A DNG conversion"],e:"Non-destructive (parametric) editing."},
{id:"L1",t:"lens",k:"mc",q:"RATS stands for…",o:["Reflected, Absorbed, Transmitted, Scattered","Refracted, Absorbed, Transmitted, Specular","Reflected, Aligned, Transmitted, Scattered","Refracted, Amplified, Transferred, Scattered"],e:"What happens to light hitting a surface. A professor favorite."},
{id:"L2",t:"lens",k:"mc",q:"Absorbed light is mostly converted into…",o:["Heat","Flare","Color","Reflection"],e:"A black shirt gets hotter in the sun."},
{id:"L3",t:"lens",k:"mc",q:"Headlights in fog bouncing back at you is an example of…",o:["Scattered light","Transmitted light","Absorbed light","Specular reflection"],e:"Scattered light is redirected, forms no image and causes flare."},
{id:"L4",t:"lens",k:"mc",q:"A positive lens is…",o:["Thicker in the center, converges light, forms a real image by itself","Thinner in the center and diverges light","Unable to form an image alone","Always flat on both sides"],e:"Positive = convex, converging."},
{id:"L5",t:"lens",k:"tf",q:"A negative lens can form a real image by itself.",a:false,e:"False. It diverges light and must be used with a positive lens."},
{id:"L6",t:"lens",k:"mc",q:"A ray passing through the center of the lens along the optical axis…",o:["Goes through undeviated","Bends the most","Is absorbed","Is reflected"],e:"The optical axis ray isn't bent."},
{id:"L7",t:"lens",k:"mc",q:"In lens equations, u is the…",o:["Object distance","Image distance","Focal length","Magnification"],e:"Trick: close the U into an O for Object. V = image distance."},
{id:"L8",t:"lens",k:"mc",q:"Focal length is the distance from the back nodal point to the focal plane when the object is at…",o:["Infinity","Twice the focal length","1 meter","The front focal point"],e:"Infinity gives parallel rays."},
{id:"L9",t:"lens",k:"mc",q:"Why do panoramic photographers find the lens's nodal point?",o:["Rotating on it reduces distortion when stitching","It increases depth of field","It removes noise","It doubles the focal length"],e:"A nodal (panoramic) head rotates the camera around that point."},
{id:"L10",t:"lens",k:"mc",q:"Why is the image on a 4×5 ground glass upside down and backwards?",o:["Lenses form inverted images, and there's no pentaprism or software to flip them","The film holder flips it","Refraction in the ground glass","It uses a negative lens"],e:"DSLRs use a pentaprism and mirrorless cameras flip it in software."},
{id:"L11",t:"lens",k:"mc",q:"Refraction is…",o:["The bending of light as it passes from one medium into another","Light bouncing off a mirror","Light turning into heat","Light spreading from dust"],e:"Its amount depends on the refractive index (water > air)."},
{id:"L12",t:"lens",k:"mc",q:"Compared with a pinhole, a lens…",o:["Collects light more efficiently, focuses to a point, and controls depth of field","Is always sharper","Needs longer exposures","Doesn't invert the image"],e:"A pinhole is sharp only at one exact distance and needs very long exposures."},
{id:"SC1",t:"scale",k:"num",q:"f = 100 mm, scale of reproduction R = 3. What is the image distance v in mm?",a:400,tol:0.5,d:"400 mm",e:"v = f(R + 1) = 100 × 4 = 400 mm."},
{id:"SC2",t:"scale",k:"num",q:"f = 100 mm, R = 3, v = 400 mm. What is the object distance u in mm? (1 decimal)",a:133.3,tol:0.2,d:"133.3 mm",e:"R = v/u → u = 400 ÷ 3 ≈ 133.3 mm."},
{id:"SC3",t:"scale",k:"num",q:"You want 1:1 with a 150 mm lens. What is the image distance v in mm?",a:300,tol:0.5,d:"300 mm",e:"1:1 → v = f(1 + 1) = 2f = 300 mm (and u = 300 mm too)."},
{id:"SC4",t:"scale",k:"num",q:"u = 300 mm, v = 150 mm. What is the focal length in mm?",a:100,tol:0.5,d:"100 mm",e:"1/300 + 1/150 = 0.01 → 1/x → f = 100 mm. Don't stop at 0.01!"},
{id:"SC5",t:"scale",k:"num",q:"u = 200 mm, v = 600 mm. What is the scale of reproduction R?",a:3,tol:0.01,d:"3 (3:1)",e:"R = v/u = 600 ÷ 200 = 3."},
{id:"SC6",t:"scale",k:"mc",q:"Your calculator shows 0.02 after adding 1/u + 1/v. The focal length is…",o:["50 mm (press 1/x)","0.02 mm","2 mm","20 mm"],e:"0.02 is 1/f. Invert it: 1/0.02 = 50 mm."},
{id:"SC7",t:"scale",k:"mc",q:"A longer focal length gives…",o:["A narrower angle of view and more magnification","A wider angle of view","More distortion","A different perspective at the same position"],e:"20 mm ≈ 94°, 50 mm ≈ 47°, 300 mm ≈ 8° (diagonal, full frame)."},
{id:"SC8",t:"scale",k:"mc",q:"What controls perspective?",o:["Camera-to-subject distance","Focal length","Sensor size","Aperture"],e:"Focal length only controls angle of view and image scale."},
{id:"SC9",t:"scale",k:"mc",q:"Approximate diagonal angle of view of a 50 mm lens on full frame?",o:["47°","94°","8°","24°"],e:"About 47°."},
{id:"SC10",t:"scale",k:"mc",q:"Short focal-length (wide-angle) lenses tend to show more distortion because…",o:["Light rays must bend more sharply","Light bends less","They have negative lenses only","They're always cheaper"],e:"More refraction → more distortion. Long lenses bend light gently."},
{id:"SC11",t:"scale",k:"tf",q:"Scale of reproduction 3:1 means the object appears 3× life size in the image.",a:true,e:"True. R = 3 → image is 3 times the object size."},

// ===== LAB 1: SENSOR PERFORMANCE AND NOISE =====
// SNR & noise
{id:"N1",t:"snr",k:"fill",q:"SNR stands for ________.",a:["signal-to-noise ratio","signal to noise ratio","signal-noise ratio"],e:"SNR = signal-to-noise ratio: how strong the real signal is compared with the noise."},
{id:"N2",t:"snr",k:"mc",q:"To measure noise, you compare a patch's mean (the signal) with its standard deviation (the noise). Which signal-to-noise ratio (SNR) formula is used?",o:["SNR = 20 × log(Mean ÷ Standard Deviation)","SNR = 20 × log(Standard Deviation ÷ Mean)","SNR = Mean × Standard Deviation","SNR = 10 × (Mean − Standard Deviation)"],e:"SNR = 20 × log₁₀(Mean ÷ Std Dev). Signal (mean) on top, noise (std dev) on the bottom."},
{id:"N3",t:"snr",k:"mc",q:"A HIGHER SNR means the image is…",o:["Cleaner, with less noise","Noisier","Brighter","More saturated"],e:"High SNR = strong signal compared with the noise = clean image."},
{id:"N4",t:"snr",k:"num",q:"Mean = 100, Std Dev = 10. What is the SNR in dB?",a:20,tol:0.1,d:"20 dB",e:"100 ÷ 10 = 10 → log₁₀(10) = 1 → 20 × 1 = 20 dB"},
{id:"N5",t:"snr",k:"num",q:"Mean = 120, Std Dev = 1.2. What is the SNR in dB?",a:40,tol:0.1,d:"40 dB",e:"120 ÷ 1.2 = 100 → log₁₀(100) = 2 → 20 × 2 = 40 dB"},
{id:"N6",t:"snr",k:"num",q:"Mean = 118, Std Dev = 2.4. What is the SNR in dB? (1 decimal)",a:33.8,tol:0.15,d:"33.8 dB",e:"118 ÷ 2.4 = 49.2 → log₁₀(49.2) ≈ 1.69 → 20 × 1.69 ≈ 33.8 dB"},
{id:"N7",t:"snr",k:"mc",q:"SNR is measured in…",o:["Decibels (dB)","Lux","Stops","Kelvin"],e:"SNR uses decibels (dB), the same unit used for sound."},
{id:"N8",t:"snr",k:"mc",q:"In Photoshop's histogram, which value represents the NOISE?",o:["Standard deviation","Mean","Median","Pixels"],e:"Std Dev = how much the pixels vary = noise. Mean = the signal."},
{id:"N9",t:"snr",k:"tf",q:"For the same patch, a larger standard deviation means more noise.",a:true,e:"True. The pixels vary more, so there's more noise and the SNR drops."},
{id:"N10",t:"snr",k:"mc",q:"Two patches have the same mean. Patch A has Std Dev 2, patch B has Std Dev 8. Which has the higher SNR?",o:["Patch A","Patch B","They are equal"],e:"Smaller std dev = less noise = higher SNR. A: mean÷2 is bigger than mean÷8."},
// Measuring noise
{id:"M1",t:"measure",k:"mc",q:"In Lab 1 (Sensor Performance and Noise), you measure a gray patch's mean and standard deviation in Photoshop. Where do you read those numbers?",o:["Window > Histogram (Expanded View)","Image > Adjustments > Levels","Filter > Noise","The Layers panel"],e:"Window > Histogram, then choose Expanded View from the panel menu."},
{id:"M2",t:"measure",k:"num",q:"In Lab 1, every gray or black ColorChecker patch is measured with a square selection of the same fixed size. How many pixels wide is that square?",a:100,tol:0,d:"100 px (100 × 100)",e:"A fixed 100 × 100 px rectangular marquee selection."},
{id:"M3",t:"measure",k:"mc",q:"When you measure noise on a patch in several photos, why use the SAME-size selection in every photo?",o:["So every measurement uses the same number of pixels and is a fair comparison","To make the image smaller","To remove noise","To find the brightest pixel"],e:"Same size = same sample for every ISO, so the numbers can be compared fairly."},
{id:"M4",t:"measure",k:"mc",q:"In Lab 1 you photograph a ColorChecker at ISO 100, 200, 400 … 6400 to compare noise. Which setting stays the SAME in every shot?",o:["Aperture (f/8)","Shutter speed","ISO","White balance only"],e:"Aperture stays at f/8. As ISO changes, the shutter speed changes to keep an equivalent exposure."},
{id:"M5",t:"measure",k:"mc",q:"ISO goes from 100 to 200 with aperture fixed. To keep an equivalent exposure, the shutter speed must…",o:["Get 1 stop faster (for example 1/60 → 1/125)","Get 1 stop slower (for example 1/60 → 1/30)","Stay the same","Get 2 stops faster"],e:"ISO +1 stop means the shutter must let in 1 stop LESS light: twice as fast."},
{id:"M6",t:"measure",k:"tf",q:"When you photograph a ColorChecker chart to measure noise, neither the white nor the black patch should be clipped.",a:true,e:"True. Clipped pixels are stuck at 0 or 255, so they can't show noise correctly."},
{id:"M7",t:"measure",k:"mc",q:"Lab 1 graphs how noise changes with ISO. On that SNR-vs-ISO graph, the x-axis is ______ and the y-axis is ______.",o:["ISO (log scale), SNR","SNR, ISO","Mean, Std Dev","Shutter speed, ISO"],e:"x = ISO on a logarithmic scale (minimum 100), y = SNR in dB."},
{id:"M8",t:"measure",k:"mc",q:"On a graph of SNR vs ISO, why is the ISO axis set to a LOGARITHMIC scale?",o:["ISO doubles each step, so a log scale spaces the stops evenly","It makes the SNR bigger","Excel requires it","It removes noise from the data"],e:"100, 200, 400… each step is ×2. On a log scale every stop is the same distance apart."},
{id:"M9",t:"measure",k:"num",q:"You take one photo at every whole-stop ISO from 100 to 6400. How many photos is that?",a:7,tol:0,d:"7 (100, 200, 400, 800, 1600, 3200, 6400)",e:"100, 200, 400, 800, 1600, 3200, 6400 = 7 images."},
// ISO & noise reduction
{id:"I1",t:"iso",k:"mc",q:"As ISO increases, SNR usually…",o:["Decreases (more noise)","Increases (less noise)","Stays the same","Doubles"],e:"Higher ISO amplifies the signal AND the noise, and less light reaches the sensor, so SNR drops."},
{id:"I2",t:"iso",k:"mc",q:"Which area of an image usually has the LOWER SNR (more visible noise)?",o:["Shadows (black patch)","Midtones (gray patch)","Both are always equal"],e:"Shadows get very little light, so the signal is small compared with the noise and the SNR is lower."},
{id:"I3",t:"iso",k:"tf",q:"When shooting JPEG, the camera applies its own noise reduction unless you turn it off.",a:true,e:"True. That's why the lab has you turn in-camera noise reduction off, and never assume the default is off."},
{id:"I4",t:"iso",k:"mc",q:"What is the main DOWNSIDE of strong noise reduction?",o:["Loss of fine detail (smearing and blurring)","More noise","Wrong exposure","Bigger files"],e:"Noise reduction smooths pixels together, which also smooths away fine detail and texture."},
{id:"I5",t:"iso",k:"mc",q:"Which two manual noise reduction sliders are in Camera Raw's Detail panel?",o:["Luminance and Color","Exposure and Contrast","Hue and Saturation","Clarity and Texture"],e:"Luminance NR smooths brightness grain. Color NR removes colored speckles."},
{id:"I6",t:"iso",k:"mc",q:"Camera Raw's Denoise feature is…",o:["AI-driven noise reduction","A sharpening filter","A white balance tool","A lens correction"],e:"Denoise uses AI to remove noise while trying to keep detail."},
{id:"I7",t:"iso",k:"mc",q:"When you measure a sensor's noise (like in Lab 1), why turn OFF the camera's noise reduction?",o:["To measure the sensor's true noise","To make the images brighter","To shoot faster","Because raw files need it off"],e:"With NR off, the std dev shows the sensor's real noise and isn't hidden by processing."},
{id:"I8",t:"iso",k:"tf",q:"Raw files are not processed by in-camera JPEG noise reduction; noise reduction is applied later in software such as Camera Raw.",a:true,e:"True. Raw data is processed on the computer, where Camera Raw applies its own default NR."},
{id:"I9",t:"iso",k:"mc",q:"Luminance noise looks like ______, and color noise looks like ______.",o:["grainy brightness speckles, colored red/green/blue blotches","colored blotches, grainy speckles","blur, sharpening halos","banding, vignetting"],e:"Luminance noise = gray grain. Color (chroma) noise = random colored specks."},
// Sensor
{id:"S1",t:"sensor",k:"mc",q:"Why do full-frame sensors usually have better noise performance than crop sensors?",o:["Larger pixels (photosites) collect more light, which gives a stronger signal and higher SNR","They have more megapixels","They use a different ISO scale","They always shoot raw"],e:"Bigger photosites catch more photons, so the signal is stronger compared with the noise."},
{id:"S2",t:"sensor",k:"mc",q:"A full-frame sensor measures about…",o:["36 × 24 mm","24 × 16 mm","17 × 13 mm","6 × 4 mm"],e:"Full frame = 36 × 24 mm, the same size as 35 mm film."},
{id:"S3",t:"sensor",k:"mc",q:"What is the crop factor of a full-frame sensor?",o:["1.0","1.5","1.6","2.0"],e:"Full frame is the reference: crop factor 1.0. APS-C is about 1.5 (1.6 for Canon), and Micro Four Thirds is 2.0."},
{id:"S4",t:"sensor",k:"tf",q:"With the same number of megapixels, a smaller sensor has smaller pixels.",a:true,e:"True. The same number of pixels squeezed into less area means each pixel is smaller and collects less light."},
{id:"S5",t:"sensor",k:"mc",q:"Pixel size (pixel pitch) is usually given in…",o:["Micrometers (µm)","Millimeters (mm)","Nanometers (nm)","Megapixels"],e:"Pixel pitch is in micrometers (µm), for example about 6 µm on many full-frame cameras."},
// Exposure & bracketing (equivalent data, not the graded lab numbers)
{id:"E1",t:"expo",k:"num",q:"You meter correctly at ISO 1600, then switch to ISO 100 with the SAME f-number and shutter speed. How many stops underexposed?",a:4,tol:0,d:"4 stops",e:"1600 → 800 → 400 → 200 → 100 = 4 stops less."},
{id:"E2",t:"expo",k:"tf",q:"Brightening an underexposed photo in post-processing also brightens its noise, especially in the shadows.",a:true,e:"True. Pushing exposure in software amplifies the noise that's already there."},
{id:"E3",t:"expo",k:"mc",q:"Base exposure N: 1/250, f/4, ISO 100. For N −4 (same shutter and ISO), use…",o:["f/16","f/11","f/22","f/8"],e:"Smaller aperture = less light: f/4 → 5.6 → 8 → 11 → 16 = 4 stops."},
{id:"E4",t:"expo",k:"mc",q:"Base N: 1/250, f/4, ISO 100. For N +2 (same shutter and ISO), use…",o:["f/2","f/2.8","f/1.4","f/5.6"],e:"Bigger aperture = more light: f/4 → 2.8 → 2 = 2 stops."},
{id:"E5",t:"expo",k:"mc",q:"Base N: 1/125, f/11, ISO 200. For N +1 using ISO 400 (same shutter), the f-number is…",o:["f/11","f/8","f/16","f/5.6"],e:"ISO 200 → 400 already gives +1 stop, so the aperture stays at f/11."},
{id:"E6",t:"expo",k:"mc",q:"Base N: 1/125, f/11, ISO 200. For N −3 using ISO 100 (same shutter), the f-number is…",o:["f/22","f/16","f/32","f/8"],e:"ISO 100 gives −1 stop, and you need −2 more from the aperture: f/11 → 16 → 22."},
{id:"E7",t:"expo",k:"mc",q:"Base N: 1/30, f/4, ISO 1600. For N +1 at f/4 (same ISO), the shutter speed is…",o:["1/15","1/60","1/8","1/30"],e:"A slower shutter lets in more light: 1/30 → 1/15 = +1 stop."},
{id:"E8",t:"expo",k:"mc",q:"Base N: 1/30, f/4, ISO 1600. To keep the SAME exposure (N) at f/11, the shutter speed is…",o:["1/4","1/8","1/15","1/2"],e:"f/4 → 11 = 3 stops less light, so the shutter must give 3 stops more: 1/30 → 1/15 → 1/8 → 1/4."},
{id:"E9",t:"expo",k:"mc",q:"Base N: 1/30, f/4, ISO 1600. For N −1 at f/8, the shutter speed is…",o:["1/15","1/30","1/60","1/8"],e:"f/4 → f/8 = −2 stops. You only want −1, so add 1 stop with the shutter: 1/30 → 1/15."},
{id:"E10",t:"expo",k:"mc",q:"In bracketing notation, \"N\" means…",o:["The base (metered) exposure","Noise","Neutral density","Number of photos"],e:"N = your base exposure. N +1 = one stop brighter, N −2 = two stops darker."}
];
/* ---------- storage (per-viewer, best effort) ---------- */
const KEY="exam2-prep-v1";
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.attempts)return s;}catch(e){}return{attempts:[],stats:{}};}
